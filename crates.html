  openSheet(`<div class="sheet-head"><div><div class="kicker">Dig list</div><h2>Not played in a year</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    ${list.length?`<div class="pick">${list.map(r=>`<div class="check" style="grid-template-columns:44px minmax(0,1fr) auto">${thumb(r)}<span class="t"><b>${esc(r.title)}</b><span>${esc(r.artist)} · ${lastPlayed(r)?'last played '+fmtDate(lastPlayed(r)):'never logged'}</span></span><button class="btn ghost sm" data-act="goto-rec" data-r="${r.id}">${esc(addrShort(r.loc))}</button></div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="stale-play">Play these</button><button class="btn" data-act="stale-pl">Save as playlist</button></div>`:`<div class="empty"><b>Everything has been played this year</b>Nice rotation.</div>`}`);
}

/* ---- cubby subtitle, whole-cubby move, swap, multi-select ---- */
document.addEventListener('change', e=>{
  if(e.target.id==='cell-name'){ const u = unit(V.unit), k = V.cell; const v = e.target.value.trim(); u.labels ||= {}; if(v) u.labels[k]=v; else delete u.labels[k];
    inCell(u.id,k).forEach(enqueueSync); setTimeout(()=>{ render(); toast(v?`${cellLabel(u,k)} is now “${v}”`:`Subtitle removed from ${cellLabel(u,k)}`); },0); }
  if(e.target.dataset?.sel){ const id = e.target.dataset.sel; e.target.checked ? V.sel.add(id) : V.sel.delete(id); setTimeout(render,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='cell-name'){ e.preventDefault(); e.target.blur(); } });
function openCubbyMove(mode){
  const u = unit(V.unit), src = {u:u.id, c:V.cell}, n = inCell(u.id,V.cell).length;
  const nm = cellName(u,V.cell);
  const units = mode==='swap' ? S.units.filter(x=>x.kind==='shelf') : S.units;
  openSheet(`<div class="sheet-head"><div><div class="kicker">${esc(u.name)} · shelf ${esc(cellLabel(u,V.cell))}${nm?' · '+esc(nm):''} · ${n} record${n===1?'':'s'}</div><h2>${mode==='swap'?'Swap with another cubby':'Move the whole cubby'}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <p class="muted" style="margin:0 0 10px;font-size:13px">${mode==='swap'?'Both cubbies trade records. Home slots follow the records.':'Every record in this cubby goes to the spot you tap. Moving to a shelf makes it their new home; a bag keeps their home so you can unpack later.'}</p>
    ${nm||mode==='swap'?`<label class="row" style="margin-bottom:12px;font-size:14px;cursor:pointer"><input type="checkbox" id="cm-label" checked style="width:18px;height:18px;accent-color:var(--accent)"> ${mode==='swap'?'Swap the subtitles too':`Bring the subtitle “${esc(nm)}” along`}</label>`:''}
    <div class="targets">${units.map(t=>targetGrid(t, mode==='swap'?'swap-to':'cubby-to', '', src, null)).join('')}</div>`);
}
function cubbyMove(to){
  const u = unit(V.unit), from = V.cell, recs = inCell(u.id, from);
  const keepLabel = $('#cm-label')?.checked !== false;
  u.labels ||= {}; const tu = unit(to.u); tu.labels ||= {}; const lab0 = JSON.stringify(u.labels), lab1 = JSON.stringify(tu.labels);
  lastUndo = snap(recs, ()=>{ u.labels = JSON.parse(lab0); tu.labels = JSON.parse(lab1); });
  recs.forEach(r=>place(r,to));
  if(tu.kind==='shelf' && keepLabel && u.labels[from]){ tu.labels[to.c] = u.labels[from]; if(!(tu===u && to.c===from)) delete u.labels[from]; }
  closeSheet();
  if(tu.kind==='shelf'){ V.unit = tu.id; V.cell = to.c; V.flash = to.c; } else { V.unit = tu.id; V.cell = 'all'; }
  render(); setTimeout(()=>{ V.flash=null; }, 2600);
  toast(`Moved ${recs.length} from ${u.id}·${cellLabel(u,from)} to ${addrShort(to)}`, true);
}
function cubbySwap(to){
  const u = unit(V.unit), a = {u:u.id,c:V.cell}, tu = unit(to.u);
  const A1 = inCell(a.u,a.c), B1 = inCell(to.u,to.c);
  const keepLabel = $('#cm-label')?.checked !== false;
  u.labels ||= {}; tu.labels ||= {}; const lab0 = JSON.stringify(u.labels), lab1 = JSON.stringify(tu.labels);
  lastUndo = snap([...A1,...B1], ()=>{ u.labels = JSON.parse(lab0); tu.labels = JSON.parse(lab1); });
  A1.forEach(r=>place(r,to)); B1.forEach(r=>place(r,a));
  if(keepLabel){ const la = u.labels[a.c], lb = tu.labels[to.c]; if(lb) u.labels[a.c]=lb; else delete u.labels[a.c]; if(la) tu.labels[to.c]=la; else delete tu.labels[to.c]; }
  closeSheet(); render(); toast(`Swapped ${u.id}·${cellLabel(u,a.c)} and ${addrShort(to)}`, true);
}
function openMultiMove(){
  const ids = [...V.sel];
  openSheet(`<div class="sheet-head"><div><div class="kicker">${ids.length} selected</div><h2>Move ${ids.length} record${ids.length===1?'':'s'}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="targets">${S.units.map(t=>targetGrid(t,'multi-to','',null,null)).join('')}</div>`);
}
function multiMove(to){
  const recs = [...V.sel].map(rec).filter(Boolean);
  lastUndo = snap(recs); let n = 0; recs.forEach(r=>{ if(place(r,to)) n++; });
  V.sel = null; closeSheet(); render(); toast(`Moved ${n} to ${addrShort(to)}`, true);
}

/* ---- gigs: packing list, load-out, return ---- */
const GIG_STEPS = [['planning','Plan'],['packing','Load out'],['out','At the gig'],['return','Back home']];
const gigStepIdx = g => g.status==='done' ? 4 : GIG_STEPS.findIndex(s=>s[0]===g.status);
const curGig = () => S.gigs.find(g=>g.id===V.gig);
function renderGigs(){
  const g = curGig();
  const sorted = S.gigs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const cards = sorted.map(x=>{ const st = x.status==='done'?'Done':GIG_STEPS[gigStepIdx(x)][1];
    return `<button class="gigcard" data-act="open-gig" data-g="${x.id}" aria-pressed="${x.id===V.gig}"><span class="d">${fmtDate(x.date)}${x.venue?' · '+esc(x.venue):''}</span><b>${esc(x.name)}</b><span class="row" style="gap:6px"><span class="pill ${x.status==='done'?'ok':'muted'}">${st}</span><span class="muted" style="font-size:13px">${x.items.length} records${unit(x.bag)?' · '+esc(unit(x.bag).name):''}</span></span></button>`; }).join('');
  return `<div class="sec-head"><div><div class="kicker">Pack, play, bring it all home</div><h2>Gigs</h2></div><button class="btn primary" data-act="new-gig">+ New gig</button></div>
    <div class="giggrid">${cards||`<div class="empty"><b>No gigs yet</b>Make one to build a packing list and track what you played.</div>`}</div>
    ${g?renderGig(g):''}`;
}
function renderGig(g){
  const idx = gigStepIdx(g), bag = unit(g.bag);
  const items = g.items.map(it=>({...it, rec:rec(it.r)})).filter(it=>it.rec);
  const packed = items.filter(it=>it.packed).length, back = items.filter(it=>it.packed&&it.back).length, played = items.filter(it=>it.played).length;
  const steps = `<ol class="steps">${GIG_STEPS.map((s,i)=>`<li class="${i<idx?'done':i===idx?'on':''}">${s[1]}</li>`).join('')}</ol>`;
  let body = '', actions = '';
  const row = (it, ctl) => `<div class="check">${ctl}${thumb(it.rec)}<span class="t"><b>${esc(it.rec.title)}</b><span>${esc(it.rec.artist)} · now ${esc(addrShort(it.rec.loc))}${hasHome(it.rec)?' · home '+esc(addrShort(it.rec.home)):''}</span></span><span></span></div>`;
  if(g.status==='planning'){
    body = items.length ? items.map(it=>`<div class="check"><span></span>${thumb(it.rec)}<span class="t"><b>${esc(it.rec.title)}</b><span>${esc(it.rec.artist)} · ${esc(addrShort(it.rec.loc))}</span></span><button class="mini-btn" data-act="gig-rm" data-r="${it.r}" aria-label="Remove ${esc(it.rec.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join('') : `<div class="empty" style="margin-top:12px"><b>No records yet</b>Add records or start from a playlist.</div>`;
    actions = `<button class="btn" data-act="gig-add">+ Add records</button>${S.playlists.length?`<label class="sr" for="gig-pl">Add a playlist</label><select id="gig-pl" style="height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px"><option value="">Add a playlist…</option>${S.playlists.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.items.length})</option>`).join('')}</select>`:''}<button class="btn primary" data-act="gig-next" ${items.length&&bag?'':'disabled'}>Start load-out</button>`;
  } else if(g.status==='packing'){
    body = `<p class="muted" style="margin:0;font-size:13.5px">Tick each record as it goes into ${esc(bag?.name||'the bag')}. Crates moves it there and remembers where it came from.</p><div class="bar"><i style="width:${items.length?packed/items.length*100:0}%"></i></div><p class="code muted" style="font-size:12px;margin:6px 0 0">${packed} of ${items.length} packed</p>`
      + items.map(it=>row(it, `<input type="checkbox" data-gig="pack" data-r="${it.r}" ${it.packed?'checked':''} aria-label="Packed ${esc(it.rec.title)}">`)).join('');
    actions = `<button class="btn" data-act="gig-back">Back to plan</button><button class="btn primary" data-act="gig-next">${packed<items.length?`Head out (${items.length-packed} left behind)`:'All packed, head out'}</button>`;
  } else if(g.status==='out'){
    body = `<p class="muted" style="margin:0;font-size:13.5px">Tick what you played tonight. It goes into each record's set history.</p>`
      + items.filter(it=>it.packed).map(it=>row(it, `<input type="checkbox" data-gig="played" data-r="${it.r}" ${it.played?'checked':''} aria-label="Played ${esc(it.rec.title)}">`)).join('');
    actions = `<button class="btn primary" data-act="gig-next">I'm home, unpack</button>`;
  } else if(g.status==='return'){
    body = `<p class="muted" style="margin:0;font-size:13.5px">Tick each record as it goes back on its shelf. Anything left unticked is flagged as missing.</p><div class="bar"><i style="width:${packed?back/packed*100:0}%"></i></div><p class="code muted" style="font-size:12px;margin:6px 0 0">${back} of ${packed} back home</p>`
      + items.filter(it=>it.packed).map(it=>row(it, `<input type="checkbox" data-gig="back" data-r="${it.r}" ${it.back?'checked':''} aria-label="Back home ${esc(it.rec.title)}">`)).join('');
    actions = `<button class="btn primary" data-act="gig-next">Finish</button>`;
  } else {
    const missing = items.filter(it=>it.packed && !it.back);
    body = `<p style="margin:0">Played <b>${played}</b> of ${packed} packed records. ${missing.length?`<span class="stale">${missing.length} not checked back in:</span>`:'Everything came home.'}</p>`
      + missing.map(it=>row(it, `<span class="pill own" style="justify-self:start">Missing</span>`)).join('')
      + `<div class="plays"><b>Played</b><ul>${items.filter(it=>it.played).map(it=>`<li>${esc(it.rec.artist)} – ${esc(it.rec.title)}</li>`).join('')||'<li>Nothing logged</li>'}</ul></div>`;
    actions = missing.length ? `<button class="btn" data-act="gig-reopen">Check in more</button>` : '';
  }
  return `<section class="gig" aria-label="${esc(g.name)}">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><span class="code muted" style="font-size:12.5px">${fmtDate(g.date)}${g.venue?' · '+esc(g.venue):''}</span><h2 style="margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.02em;line-height:1">${esc(g.name)}</h2>
      <span class="muted" style="font-size:13px">${items.length} records · bag ${bag?esc(bag.name):'not set'}</span></div>
      <div class="row"><button class="btn sm" data-act="gig-play" ${items.length?'':'disabled'}>Play the list</button><button class="btn sm danger" data-act="gig-del">Delete</button></div></div>
    ${steps}<div style="margin-top:10px">${body}</div><div class="row" style="margin-top:14px">${actions}</div><div id="gig-confirm"></div></section>`;
}

const ARTIFACT_URL = 'https://crates-livid.vercel.app/';   // live site: stickers made in the preview point here
const IN_ARTIFACT = !!window.claude;
const BASE_URL = (IN_ARTIFACT || location.protocol==='file:' || /^(localhost|127\.)/.test(location.hostname) || /claude/.test(location.hostname)) ? ARTIFACT_URL : location.origin + location.pathname;
const stickerToken = (u, c) => c==null ? u.id : `${u.id}-${cellLabel(u,c)}`;
function qrPath(text){
  if(typeof qrcode!=='function') return null;
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
  return {n, d};
}
function stickerSVG(it, inches){
  const S96 = Math.round(inches*96), url = BASE_URL + '#' + it.token, qr = qrPath(url);
  if(!qr) return '';
  const pad = S96*0.06, qs = S96*0.70, q0 = (S96-qs)/2, mod = qs/(qr.n+2);
  const big = inches>=1.4, fs1 = S96*(big?0.105:0.13), fs2 = S96*0.07;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S96} ${S96}" width="${S96}" height="${S96}"><rect x=".5" y=".5" width="${S96-1}" height="${S96-1}" rx="${S96*0.06}" fill="#fff" stroke="#d8d8d8"/>
    <g transform="translate(${q0+mod} ${pad}) scale(${mod})"><path d="${qr.d}" fill="#111"/></g>
    <text x="${S96/2}" y="${pad+qs+fs1*0.95}" text-anchor="middle" font-family="Arial Narrow,Arial,Helvetica,sans-serif" font-weight="700" font-size="${fs1}" fill="#111">${esc(it.code)}</text>
    ${big&&it.sub?`<text x="${S96/2}" y="${pad+qs+fs1+fs2*1.25}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="${fs2}" fill="#555">${esc(it.sub.slice(0,26))}</text>`:''}</svg>`;
}
const stk = {units:null, cubbies:true, size:1.5};
function stickerItems(){
  const out = [];
  S.units.filter(u=>stk.units.has(u.id)).forEach(u=>{
    out.push({token:stickerToken(u), code:u.id, sub:u.name});
    if(u.kind==='shelf' && stk.cubbies) cellKeys(u).forEach(k=>out.push({token:stickerToken(u,k), code:`${u.id}·${cellLabel(u,k)}`, sub:cellName(u,k)||u.name}));
  });

}

  openSheet(`<div class="sheet-head"><div><div class="kicker">Scan one with your phone to open that shelf</div><h2>QR stickers</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>

    <p class="muted" style="font-size:12.5px;margin:12px 0 0">${items.length} sticker${items.length===1?'':'s'} on ${pages} letter page${pages===1?'':'s'}, printed at actual size. Each code opens a link like <span class="code" style="overflow-wrap:anywhere">${esc(BASE_URL)}#K1-A2</span>${IN_ARTIFACT?'. Once Crates has its own site, the codes point there.':'.'}</p>
    <div class="row" style="margin-top:12px">${IN_ARTIFACT?'':`<button class="btn primary" data-act="stk-print">Print</button>`}<button class="btn ${IN_ARTIFACT?'primary':''}" data-act="stk-save" data-f="html">Save print-ready page</button><button class="btn" data-act="stk-save" data-f="svg">Save SVG</button><button class="btn" data-act="stk-save" data-f="png">Save PNG</button></div>
    <div id="stk-msg"></div>`:`<div class="notice">The QR generator didn't load, so stickers can't be drawn right now.</div>`}`);

function sheetPages(items){
  const W = 8.5*96, H = 11*96, M = 0.5*96, G = 0.125*96, s = Math.round(stk.size*96);
  const cols = Math.max(1, Math.floor((W-2*M+G)/(s+G))), rows = Math.max(1, Math.floor((H-2*M+G)/(s+G))), per = cols*rows;
  const pages = []; for(let i=0;i<items.length;i+=per) pages.push(items.slice(i,i+per));
  return pages.map(pg=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>${pg.map((it,i)=>`<g transform="translate(${M+(i%cols)*(s+G)} ${M+Math.floor(i/cols)*(s+G)})">${stickerSVG(it,stk.size).replace('<svg xmlns="http://www.w3.org/2000/svg"','<svg')}</g>`).join('')}</svg>`);
}
async function saveStickers(fmt){

      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'crates-qr-stickers.'+fmt; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); say('Saved.'); return; }

const printHtml = pages => `<!doctype html><html><head><meta charset="utf-8"><title>Crates QR stickers</title><style>@page{size:letter;margin:0}body{margin:0}svg{display:block;width:8.5in;height:11in;page-break-after:always}</style></head><body>${pages.join('')}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
function multiSvg(pages){ const W = 8.5*96, H = 11*96;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H*pages.length}" width="${W}" height="${H*pages.length}">${pages.map((p,i)=>`<g transform="translate(0 ${H*i})">${p.replace('<svg xmlns="http://www.w3.org/2000/svg"','<svg')}</g>`).join('')}</svg>`; }
function svgToPng(svg, scale){

    img.onerror = () => { URL.revokeObjectURL(url); rej('img'); }; img.src = url; });

/* =====================================================================
   PLAYER — ported from discogs-stream (YouTubePlayer + MobilePlayer chain)
   ===================================================================== */
const P = {queue:[], i:-1, playing:false, mode:'loading', yt:null, ready:false, st:{}, timers:[], log:[], progT:null, dry:null, open:false, tab:'queue', src:''};
const CHAIN = ['Load the saved YouTube link','3-second window: must start playing or buffering','Try the cached alternate links','Force a fresh search (Crates backend)','Mark not working · offer “Search on YouTube” · skip'];
function stOf(r){ return P.st[r.id] ||= {cand:0, state: r.yt.length?'pending':'non_working', step:0, fails:{}}; }
function clearTimers(){ P.timers.forEach(clearTimeout); P.timers=[]; }
function plog(m){ P.log.unshift(new Date().toLocaleTimeString([], {minute:'2-digit',second:'2-digit'})+'  '+m); P.log=P.log.slice(0,30); }

function loadYT(){
  return new Promise((res,rej)=>{
    if(window.YT?.Player) return res();
    const t = setTimeout(()=>rej('timeout'), 6000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(t); res(); };
    const s = document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
    s.onerror = () => { clearTimeout(t); rej('blocked'); };
    document.head.appendChild(s);
  });
}
const YT_VARS = {autoplay:0,controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,playsinline:1,origin:location.origin};
loadYT().then(()=>{
  /* Two players: #yt plays, #yt2 holds the next record's link cued and ready (prefetch). Events are routed by which player fired them. */
  const mk = (el, onReady) => new YT.Player(el, {height:'180', width:'320', host:'https://www.youtube-nocookie.com', playerVars:YT_VARS,
    events:{ onReady, onStateChange:e=>{ if(e.target===P.yt) onYTState(e.data); },
             onError:e=>{ if(e.target===P.yt) failCandidate('YouTube error '+e.data); else if(P.cued){ plog(`prefetch of ${rec(P.cued.rid)?.title||'next'} failed (${e.data})`); P.cued=null; } } }});
  P.yt = mk('yt', ()=>{ P.ready=true; P.mode='yt'; renderPlayer(); prefetchNext(); });
  P.yt2 = mk('yt2', ()=>{ P.standby=true; prefetchNext(); });
  setTimeout(()=>{ if(!P.ready){ P.mode='link'; renderPlayer(); } }, 6000);
}).catch(why=>{ P.mode='link'; plog('Inline playback unavailable ('+why+'), using YouTube links'); renderPlayer(); });

function setQueue(list, start=0, src=''){ if(!list.length) return; if(P.preview){ clearTimeout(P.preview.timer); P.preview = null; } P.queue = list.map(r=>r.id); P.src = src; playAt(start); }
function cur(){ return rec(P.queue[P.i]); }
function playAt(i){
  if(!P.queue.length) return;
  P.i = (i+P.queue.length)%P.queue.length; clearTimers();
  const r = cur(); if(!r){ P.queue.splice(P.i,1); return playAt(P.i); }
  const st = stOf(r);
  if(st.state==='non_working' && r.yt.length){ st.state='pending'; st.cand=0; st.fails={}; }
  P.playing = true;
  if(P.mode!=='yt'){ st.step=0; renderPlayer(); return; }
  if(!r.yt.length){ st.state='non_working'; st.step=4; plog(`${r.title}: no saved link, search on YouTube, skipping in 3s`); renderPlayer(); P.timers.push(setTimeout(()=>next(), 3000)); return; }
  loadCandidate();
}
const PREFETCH_AHEAD = 4;   // discogs-stream: MobilePlayer.tsx prefetches the next 4
function prefetchNext(){
  if(P.mode!=='yt' || !P.standby || !P.yt2?.cueVideoById || P.preview || !P.queue.length) return;
  const ahead = []; for(let k=1; k<=PREFETCH_AHEAD && k<P.queue.length; k++) ahead.push(rec(P.queue[(P.i+k)%P.queue.length]));
  ahead.filter(Boolean).forEach(r=>{ const st = stOf(r); if(!r.yt.length && !st.pf){ st.pf = true; plog(`${r.title}: no saved link; the full app searches YouTube here (prefetch)`); } });
  const n = ahead[0]; if(!n || !n.yt.length){ P.cued = null; return; }
  const id = n.yt[stOf(n).cand||0]; if(P.cued?.id===id) return;
  try{ P.yt2.cueVideoById(id); P.cued = {rid:n.id, id}; plog(`${n.title}: next link cued in the standby player`); }catch(e){ P.cued = null; }
}
function loadCandidate(){
  const r = cur(), st = stOf(r), id = r.yt[st.cand];
  st.state='trying'; plog(`${r.title}: link ${st.cand+1}/${r.yt.length} (${id})`);
  if(P.cued && P.cued.rid===r.id && P.cued.id===id && P.yt2){
    try{ P.yt.stopVideo?.(); }catch(e){}
    [P.yt, P.yt2] = [P.yt2, P.yt]; P.cued = null; plog(`${r.title}: swapped in the prefetched player`);
    P.yt.playVideo();
  } else P.yt.loadVideoById(id);
  setTimeout(prefetchNext, 1200);
  st.step = st.cand===0?1:2; renderPlayer();
  P.timers.push(setTimeout(()=>{ const s = P.yt.getPlayerState?.(); if(s===1||s===3) return; failCandidate('no signal within 3s'); }, 3000));
  P.timers.push(setTimeout(()=>{ if(P.yt.getPlayerState?.()===3) failCandidate('stalled while buffering'); }, 12000));
}
function onYTState(s){
  const r = cur(); if(!r) return; const st = stOf(r);
  if(s===1){ P.playing = true;
    const d = P.yt.getDuration?.()||0;
    if(d>0 && d<30){ failCandidate('only '+Math.round(d)+'s long, likely a teaser'); return; }
    if(st.state!=='working'){ st.state='working'; plog(`${r.title}: playing`); clearTimers(); saveWorkingLink(r, st); }
    if(P.preview) previewOnPlaying();
    tick(); }
  if(s===2){ P.playing=false; }
  if(s===0){ if(P.preview){ stopPreview(); return; } next(); return; }
  renderPlayer();
}
function failCandidate(reason){
  const r = cur(); if(!r) return; const st = stOf(r); clearTimers();
  st.fails[st.cand] = reason; plog(`${r.title}: link ${st.cand+1} failed, ${reason}`);
  st.cand++;
  if(st.cand < r.yt.length){ loadCandidate(); return; }
  st.step = 4; st.state='non_working';
  r.ytStatus = 'non_working'; r.ytChecked = todayISO(); save();
  plog(`${r.title}: all links failed, marked not working, skipping`);
  renderPlayer(); P.timers.push(setTimeout(()=>next(), 1500));
}
/* the link that played becomes the record's primary link; the others stay as alternates, in order */
function saveWorkingLink(r, st){

function fitRoom(){
  const room = document.querySelector('.room.fit'); if(!room) return;
  const cards = room.children.length; if(!cards) return;
  const W = room.clientWidth, gap = 16;
  const top = room.getBoundingClientRect().top + window.scrollY;
  const playerH = document.getElementById('player')?.hidden ? 0 : (document.getElementById('player').offsetHeight||0);
  const H = Math.max(260, window.innerHeight - (top - window.scrollY) - playerH - 56);
  let best = {cols:1, size:0};
  for(let c=1;c<=cards;c++){
    const rows = Math.ceil(cards/c), cw = (W-gap*(c-1))/c, ch = (H-gap*(rows-1))/rows;
    if(cw < 150 || ch < 140) continue;
    const chc = Math.min(ch, cw*1.0 + 70);          // don't let cards get taller than they need
    const art = Math.min(cw-28, (chc-84)*1.25);
    if(art > best.size + 2) best = {cols:c, size:art, ch:chc};
  }
  if(!best.size){ room.classList.remove('fit'); room.style.cssText=''; return; }
  room.style.setProperty('--cols', best.cols);
  room.style.setProperty('--card-h', Math.floor(best.ch)+'px');
  room.style.setProperty('--art-h', Math.floor(best.ch-84)+'px');
  room.querySelectorAll('.stage-box').forEach(fitArt);
}
function fitArt(box){
  const art = box.firstElementChild; if(!art) return;
  const a = +box.dataset.aspect || 1, bw = box.clientWidth, bh = box.clientHeight;
  if(!bw || !bh) return;
  art.style.width = Math.max(40, Math.min(bw, bh * a)) + 'px';
}
function fitStrip(){ document.querySelectorAll('.strip .stage-box').forEach(fitArt); }

  }

const PREVIEW_SECS = 30;
function previewBtn(r, big){
  const on = P.preview?.rid===r.id;
  const icon = on ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h10v12H7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="5" height="7" rx="1.5"/><rect x="16" y="14" width="5" height="7" rx="1.5"/></svg>';

    const href = r.yt.length ? `https://www.youtube.com/watch?v=${r.yt[0]}&t=60s` : ytSearch(r);

function startPreview(rid){
  const r = rec(rid); if(!r) return;
  if(P.preview?.rid===rid){ stopPreview(); return; }
  if(P.preview) stopPreview(true);
  P.preview = {rid, saved:{queue:[...P.queue], i:P.i, src:P.src}, seeked:false, end:0};
  P.queue = [rid]; P.src = 'Preview'; playAt(0); render();
}

  clearTimeout(pv.timer); P.preview = null;
  try{ P.yt?.pauseVideo?.(); }catch(e){}
  P.playing = false; P.queue = pv.saved.queue; P.i = pv.saved.i; P.src = pv.saved.src;
  clearTimers(); renderPlayer(); if(!silent) render();

function previewOnPlaying(){
  const pv = P.preview; if(!pv || pv.seeked) return;
  pv.seeked = true;
  const d = P.yt.getDuration?.()||0;

    if(drag || e.button===1 || e.button===2) return;
    if(e.target.closest('.map-tools')) return;
    cancelAnimationFrame(M.raf);
    M.ptrs.set(e.pointerId, pt(e));   // capture only once a pan starts, so a plain tap still clicks the cubby under it
    if(M.ptrs.size===1){ const p = pt(e); M.start = {x:p.x, y:p.y, mx:M.x, my:M.y, t:performance.now()}; M.panning=false; M.vx=M.vy=0; M.samples=[{x:p.x,y:p.y,t:performance.now()}]; }
    if(M.ptrs.size===2){ const [a,b] = [...M.ptrs.values()]; M.pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, s:M.s, x:M.x, y:M.y}; M.panning=true; }
  };
  m.onpointermove = e => {
    if(!M.ptrs.has(e.pointerId)) return;
    if(drag?.on){ M.ptrs.clear(); return; }
    const p = pt(e); M.ptrs.set(e.pointerId, p);
    if(M.ptrs.size>=2 && M.pinch){
      const [a,b] = [...M.ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
      const s = Math.max(.08, Math.min(2.5, M.pinch.s * d/M.pinch.d)); const k = s/M.pinch.s;
      M.x = cx - (M.pinch.cx - M.pinch.x)*k; M.y = cy - (M.pinch.cy - M.pinch.y)*k; M.s = s; M.moved = true;
      if(!m.hasPointerCapture(e.pointerId)){ try{ M.ptrs.forEach((v,id)=>m.setPointerCapture(id)); }catch(x){} }
      m.classList.add('panning'); mapApply(false); return;
    }
    if(M.ptrs.size===1 && M.start){
      const dx = p.x - M.start.x, dy = p.y - M.start.y;
      if(!M.panning && Math.hypot(dx,dy) < 6) return;
      if(!M.panning){ M.panning = true; m.classList.add('panning'); try{ m.setPointerCapture(e.pointerId); }catch(x){} }
      M.x = M.start.mx + dx; M.y = M.start.my + dy; M.moved = true;
      mapClamp(true);
      M.samples.push({x:p.x,y:p.y,t:performance.now()}); if(M.samples.length>6) M.samples.shift();
      mapApply(false);
    }
  };
  const up = e => {
    if(!M.ptrs.has(e.pointerId)) return;
    M.ptrs.delete(e.pointerId); try{ m.releasePointerCapture(e.pointerId); }catch(x){}
    if(M.ptrs.size===1){ const [p] = [...M.ptrs.values()]; M.start = {x:p.x, y:p.y, mx:M.x, my:M.y, t:performance.now()}; M.pinch=null; M.samples=[]; return; }
    if(M.ptrs.size) return;
    m.classList.remove('panning'); M.pinch = null;
    if(M.panning){
      mapJustPanned = true; setTimeout(()=>{ mapJustPanned=false; }, 80);
      const sm = M.samples||[]; const a = sm[0], b = sm[sm.length-1];
      if(a && b && b.t>a.t && e.pointerType!=='mouse'){ M.vx = (b.x-a.x)/(b.t-a.t)*16; M.vy = (b.y-a.y)/(b.t-a.t)*16; mapInertia(); }
      else { mapClamp(); mapApply(true); }
    } else if(e.pointerType!=='mouse'){
      const now = performance.now(); if(now - M.lastTap < 320){ const pl = e.target.closest('.plate'); if(pl) mapZoomUnit(pl.dataset.plate); else mapFit(true); M.lastTap = 0; } else M.lastTap = now;
    }
    M.panning = false;
  };
  m.onpointerup = up; m.onpointercancel = up;
  m.ondblclick = e => { if(e.target.closest('.map-tools')) return; const pl = e.target.closest('.plate'); if(pl) mapZoomUnit(pl.dataset.plate); else mapFit(true); };
  m.onwheel = e => {
    e.preventDefault();
    const p = pt(e);
    const pinch = e.ctrlKey || e.metaKey;
    const wheelMouse = e.deltaMode===1 || (Math.abs(e.deltaY) >= 100 && !e.deltaX);
    if(pinch || wheelMouse){ const f = Math.exp(-(pinch ? e.deltaY*.01 : Math.sign(e.deltaY)*.18)); mapZoomAt(f, p.x, p.y, false); }
    else { M.x -= e.deltaX; M.y -= e.deltaY; M.moved = true; mapClamp(true); mapApply(false); }
  };
  bindSheetDrag();
}
function mapInertia(){
  cancelAnimationFrame(M.raf);
  const step = () => {
    M.vx *= .92; M.vy *= .92; M.x += M.vx; M.y += M.vy; mapClamp(true); mapApply(false);
    if(Math.abs(M.vx) > .3 || Math.abs(M.vy) > .3) M.raf = requestAnimationFrame(step); else { mapClamp(); mapApply(true); }
  };
  M.raf = requestAnimationFrame(step);
}
/* phone: the records sheet snaps to peek / half / full */
const SNAPS = {peek:.14, half:.46, full:.92};
function sheetSet(snap, anim=true){
  M.sheet = snap; document.body.classList.toggle('overlay', isPhone() && V.view==='map' && snap==='full'); const p = document.querySelector('.spot-panel'); if(!p) return;
  p.dataset.snap = snap; p.classList.toggle('dragging', !anim); p.style.setProperty('--sheet-h', (SNAPS[snap]*100)+'%');
}
function bindSheetDrag(){
  const p = document.querySelector('.spot-panel'); if(!p || !isPhone()) return;
  p.style.setProperty('--sheet-h', (SNAPS[M.sheet]*100)+'%');
  const head = p.querySelector('.spot-head'); if(!head) return;
  let st = null;
  head.onpointerdown = e => { if(e.target.closest('button,input,a')) return; const H = p.parentElement.clientHeight; st = {y:e.clientY, h:p.offsetHeight, H, t:performance.now(), moved:false, samples:[{y:e.clientY, t:performance.now()}]}; head.setPointerCapture(e.pointerId); p.classList.add('dragging'); };
  head.onpointermove = e => { if(!st) return; const dy = st.y - e.clientY; if(Math.abs(dy)>4) st.moved=true; const h = Math.max(st.H*.1, Math.min(st.H*.94, st.h+dy)); p.style.setProperty('--sheet-h', h+'px'); st.samples.push({y:e.clientY, t:performance.now()}); if(st.samples.length>12) st.samples.shift(); };
  const end = e => { if(!st) return; const s = st; st = null; p.classList.remove('dragging');
    /* release velocity: the last ~100 ms of movement, zero if the finger stopped before letting go */
    const sm = s.samples, last = sm[sm.length-1], ref = sm.find(q=>last.t - q.t <= 100) || last;
    const h = p.offsetHeight / s.H; const v = (performance.now() - last.t > 80 || ref===last) ? 0 : (ref.y - last.y)/Math.max(1, last.t - ref.t);
    let snap;
    if(!s.moved){ snap = M.sheet==='peek' ? 'half' : M.sheet==='half' ? 'full' : 'half'; }
    else if(Math.abs(v) > .4) snap = v>0 ? (M.sheet==='peek'?'half':'full') : (M.sheet==='full'?'half':'peek');
    else snap = Object.keys(SNAPS).reduce((a,k)=>Math.abs(SNAPS[k]-h) < Math.abs(SNAPS[a]-h) ? k : a, 'half');
    sheetSet(snap, true); navigator.vibrate?.(6); };
  head.onpointerup = end; head.onpointercancel = end;
}

/* phone push/pop between columns with a same-document view transition */
function colGo(col, dir){
  if(!isPhone() || col===V.col){ V.col = col; render(); return; }   // same column (e.g. stepping spots): no new history entry, no slide
  if(dir==='push') try{ history.pushState({crates:col}, ''); }catch(e){}   // every push gets an entry, so the system Back pops a column instead of leaving
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.dataset.navdir = dir;
  const apply = () => { V.col = col; render(); };
  if(!document.startViewTransition || reduce || navigator.webdriver || V.view!=='columns'){ apply(); return; }
  document.startViewTransition(apply).finished.finally(()=>{ delete document.documentElement.dataset.navdir; });
}
window.addEventListener('popstate', e=>{
  if(V.view==='columns' && isPhone() && V.col!=='spots'){ colGo(V.col==='record' ? 'records' : 'spots', 'pop'); }
});

/* ---------- cue bar widths: size pads to their text, drop the names when tight ---------- */
function fitCue(){
  const bar = document.querySelector('.cuebar'); if(!bar) return;
  bar.classList.remove('tight');
  const pads = [...bar.querySelectorAll('.cue')];
  const need = pads.reduce((a,p)=>a + Math.max(88, (p.querySelector('b')?.textContent.length||4)*8.2 + (p.querySelector('.nm')?.textContent.length||0)*0 + 48), 0) + (pads.length-1)*8;
  const W = bar.clientWidth;
  if(need > W) bar.classList.add('tight');
}

  if(T.filt==='nohome' && hasHome(r)) return false;

function tCommit(el){
  const r = rec(el.dataset.r); if(!r) return;
  const f = el.dataset.tedit; let v = el.value;
  const before = f==='tags' ? r.tags.join(', ') : String(r[f]??''); if(before===v.trim()) return;
  const prev = f==='tags' ? [...r.tags] : r[f]; lastUndo = () => { r[f] = prev; }; if(UNDO.length) UNDO[UNDO.length-1].label = `Edited ${f} of ${r.title}`;
  if(f==='tags') r.tags = v.split(',').map(x=>x.trim()).filter(Boolean);
  else if(f==='rating') r.rating = +v||0;
  else r[f] = v.trim();
  el.classList.toggle('edited', editedSet(r).has(f));
  save();
}

  const lines = [head.join(',')].concat(tRows().map(r=>[r.artist,r.title,r.label,r.catno,r.year,r.style,r.bpm,r.key,r.rating||'',r.tags.join('; '),r.notes,addrLong(r.loc),hasHome(r)?addrLong(r.home):'',inBagNow(r)?unit(r.loc.u).name:'',lastPlayed(r),(r.plays||[]).length].map(csvCell).join(',')));
  const data = lines.join('\n');
  let dl = null; try{ dl = await window.claude?.use?.('downloads'); }catch(e){}
  try{
    if(dl) await dl.save({filename:'crates-collection.csv', data});
    else if(!IN_ARTIFACT){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type:'text/csv'})); a.download='crates-collection.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
    else { toast('Saving files isn’t available in this view'); return; }
    toast('CSV saved');
  }catch(e){ toast(e?.code==='declined'?'Export cancelled':'Couldn’t save the CSV'); }
}

/* =====================================================================
   COLLECTION FILES: save/load locally, import from Discogs (CSV export or demo),
   upload to Discogs (queued), and 4 rolling backups with a picker
   ===================================================================== */
const BK_KEY = 'crates-backups', BK_MAX = 4;
function backups(){ try{ const b = JSON.parse(localStorage.getItem(BK_KEY)||'[]'); return Array.isArray(b) ? b : []; }catch(e){ return []; } }
function backupNow(label, kind='manual'){
  const list = backups();
  const entry = {id:uid('b'), at:new Date().toISOString(), label, kind, records:S.records.length, units:S.units.length, state:JSON.parse(JSON.stringify(S))};
  list.unshift(entry); while(list.length > BK_MAX) list.pop();
  try{ localStorage.setItem(BK_KEY, JSON.stringify(list)); }catch(e){ toast('Couldn’t store the backup (storage is full)'); return null; }
  return entry;
}
function restoreBackup(id){
  const b = backups().find(x=>x.id===id); if(!b) return;
  let next; try{ if(b.state?.v!==2) throw 0; next = migrate(JSON.parse(JSON.stringify(b.state))); }catch(e){ toast('That backup can’t be read, so nothing changed'); return; }
  backupNow('Before restoring “'+b.label+'”', 'restore');
  S = next; V.sel=null; V.stale=false; P.st={}; closeSheet(); V.view = roomView(); M.moved = false; render(); renderPlayer();
  toast(`Restored “${b.label}” (${b.records} records)`);
}
function deleteBackup(id){ const list = backups().filter(x=>x.id!==id); localStorage.setItem(BK_KEY, JSON.stringify(list)); openBackups(); }
const fmtWhen = iso => { const d = new Date(iso); return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
function openBackups(){
  const list = backups();
  openSheet(`<div class="sheet-head"><div><div class="kicker">${list.length} of ${BK_MAX} slots used · newest first</div><h2>Backups</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <p class="muted" style="margin:0 0 12px;font-size:13.5px">A backup is made automatically before every import, restore and reset. The oldest is dropped when all ${BK_MAX} slots are used. Backups live in this browser; use <b>Save to file</b> for a copy you can keep.</p>
    <div class="row" style="margin-bottom:14px"><button class="btn primary" data-act="bk-now">Back up now</button><button class="btn" data-act="col-save">Save to file</button><label class="btn file">Load from file<input type="file" id="col-load" accept=".json,application/json"></label><button class="btn" data-act="dg-import">Import from Discogs…</button></div>
    ${list.length ? `<div class="links">${list.map(b=>`<div class="link" style="grid-template-columns:minmax(0,1fr) auto"><span class="t"><b>${esc(b.label)}</b><span>${fmtWhen(b.at)} · ${b.records} records in ${b.units} places · ${b.kind}</span></span><span class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="bk-restore" data-b="${b.id}">Restore</button><button class="btn sm ghost danger" data-act="bk-del" data-b="${b.id}" aria-label="Delete backup ${esc(b.label)}">✕</button></span></div>`).join('')}</div>`
      : `<div class="empty"><b>No backups yet</b>Back up now, or import a collection and one is made for you.</div>`}
    <div id="bk-confirm"></div>`);
  $('#col-load').onchange = e => loadCollectionFile(e.target.files[0]);
}
async function saveCollectionFile(){
  const data = JSON.stringify({app:'crates', v:S.v, savedAt:new Date().toISOString(), state:S}, null, 1);
  const filename = `crates-${todayISO()}.json`;
  let dl = null; try{ dl = await window.claude?.use?.('downloads'); }catch(e){}
  try{
    if(dl) await dl.save({filename, data});
    else if(!IN_ARTIFACT){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download = filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
    else { toast('Saving files isn’t available in this view'); return; }
    toast('Collection saved to '+filename);
  }catch(e){ toast(e?.code==='declined' ? 'Save cancelled' : 'Couldn’t save the file'); }
}
function loadCollectionFile(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let j; try{ j = JSON.parse(rd.result); }catch(e){ toast('That file isn’t a Crates collection'); return; }
    const st = j?.state || j;
    if(!st || st.v!==2 || !Array.isArray(st.units) || !Array.isArray(st.records)){ toast('That file isn’t a Crates collection'); return; }
    let next; try{ next = migrate(st); }catch(e){ toast('That file isn’t a Crates collection'); return; }
    backupNow('Before loading '+file.name, 'import');
    S = next; V.sel=null; V.stale=false; P.st={}; closeSheet(); V.view = roomView(); M.moved = false; render(); renderPlayer();
    toast(`Loaded ${S.records.length} records from ${file.name} (backup made)`, false);
  };
  rd.readAsText(file);
}
/* Discogs import. Real path: the user's CSV export from discogs.com (Collection → Export), parsed here. Demo path: a sample. API import needs the server (see research/discogs-api.md). */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=ch; }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r[0]||'').trim());
}
const PALS = [['#E4572E','#F1E4CC','#1F4FA8'],['#2C8C7A','#F5A524','#1E1E1E'],['#7A2B5C','#F2E3C6','#D9283C'],['#1F5FBF','#F2F2F2','#F5A524'],['#B9E05A','#121212','#E8706F'],['#4B2A8C','#FFD166','#06D6A0']];
function recordFromDiscogsRow(h, r){
  const g = k => { const i = h.findIndex(x=>x.trim().toLowerCase()===k); return i>=0 ? (r[i]||'').trim() : ''; };
  const artist = g('artist'), title = g('title'); if(!artist && !title) return null;
  const n = hash(artist+title);
  const out = {id:uid('r'), artist, title, label:g('label').split(',')[0].trim(), year:g('released').slice(0,4), style:g('genre')||g('style')||'', catno:g('catalog#')||g('catno'), barcode:'', bpm:'', key:'', rating:+g('rating')||0, cm:g('collection media condition')||'', cs:'', notes:g('collection notes')||g('notes')||'', tags:[], custom:[], yt:[], pal:PALS[n%PALS.length], pat:n%6, loc:{u:null,c:null}, home:null, from:null, plays:[], orig:{}, releaseId:+g('release_id')||null, folder:g('collectionfolder')||''};
  ['artist','title','label','catno','year','style'].forEach(k=>{ out.orig[k] = out[k]; });   // the Discogs original, for "Edited by me" and Undo edit
  return out;
}
const DEMO_DISCOGS = [['Underground Resistance','The Final Frontier','Underground Resistance','1991','Techno'],['Larry Heard','Alien','Black Market International','1996','Deep House'],['Kraftwerk','Tour De France','EMI','1983','Electro'],['Jeff Mills','The Bells','Purpose Maker','1996','Techno'],['Armand Van Helden','Witch Doktor','Strictly Rhythm','1994','House'],['Aphex Twin','Didgeridoo','R&S Records','1992','Techno']];
function openDiscogsImport(){
  openSheet(`<div class="sheet-head"><div><div class="kicker">Collection → Export on discogs.com gives you a CSV</div><h2>Import from Discogs</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <p class="muted" style="margin:0 0 10px;font-size:13.5px">A backup of your current collection is made first. Imported records land as <b>Unplaced</b>; file them from the Collection tab or by dragging. Records you already own (same artist and title) are skipped.</p>
    <div class="row" style="margin-bottom:14px"><label class="btn primary file">Load Discogs CSV export<input type="file" id="dg-csv" accept=".csv,text/csv"></label><button class="btn" data-act="dg-demo">Import a demo collection (6 records)</button></div>
    <div class="bcbox"><b style="font-size:14px">Upload to your Discogs collection</b><p class="muted" style="margin:6px 0 10px;font-size:13px">Adds records that aren’t in your Discogs collection yet, and writes each one’s spot to the “Location” field. Queued here; the full app sends them from the server within the 60 requests/minute limit.</p>
      <div class="row"><button class="btn" data-act="dg-upload-open">Upload to Discogs…</button><span class="muted" style="font-size:13px">${S.syncQueue.filter(q=>q.kind==='add').length} adds waiting</span></div></div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">Importing straight from the Discogs API needs a server-side token (research/discogs-api.md), so the prototype reads the CSV export instead.</p>`);
  $('#dg-csv').onchange = e => { const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => importDiscogsRows(parseCSV(rd.result), f.name); rd.readAsText(f); };
}
function importDiscogsRows(rows, label){
  if(!rows.length){ toast('Nothing to import'); return; }
  const h = rows[0], recs = rows.slice(1).map(r=>recordFromDiscogsRow(h,r)).filter(Boolean);
  const have = new Set(S.records.map(r=>norm(r.artist)+'|'+norm(r.title)));
  const fresh = recs.filter(r=>!have.has(norm(r.artist)+'|'+norm(r.title)));
  if(!recs.length){ toast('No records found in that file'); return; }
  backupNow('Before importing '+label, 'import');
  S.records.push(...fresh); S.imports ||= []; S.imports.push({at:new Date().toISOString(), label, added:fresh.length, skipped:recs.length-fresh.length});
  closeSheet(); V.view='table'; T.filt='unplaced'; T.spot=null; render();
  toast(`Imported ${fresh.length} records${recs.length-fresh.length?` · ${recs.length-fresh.length} already owned`:''} · backup made`);
}
function importDemoDiscogs(){
  const h = ['Artist','Title','Label','Released','Genre'];
  importDiscogsRows([h, ...DEMO_DISCOGS], 'the demo Discogs collection');
}
/* delete records; Undo puts them back where they were (in the same order), and in every playlist and gig they were in */
function deleteRecords(ids){
  const set = new Set(ids); const gone = [];
  S.records.forEach((r,i)=>{ if(set.has(r.id)) gone.push({r, i}); });
  if(!gone.length) return;
  const pl = S.playlists.map(p=>[p, [...p.items]]), gg = S.gigs.map(g=>[g, [...g.items]]), q = P.queue.slice(), qi = P.i;
  S.records = S.records.filter(r=>!set.has(r.id));
  S.playlists.forEach(p=>{ p.items = p.items.filter(id=>!set.has(id)); }); S.gigs.forEach(g=>{ g.items = g.items.filter(it=>!set.has(it.r)); });
  S.syncQueue = S.syncQueue.filter(x=>!set.has(x.r)); T.sel.clear(); P.queue = P.queue.filter(id=>!set.has(id)); if(P.i>=P.queue.length) P.i = P.queue.length-1;
  lastUndo = () => { gone.sort((a,b)=>a.i-b.i).forEach(({r,i})=>S.records.splice(Math.min(i, S.records.length), 0, r)); pl.forEach(([p,items])=>{ p.items = items; }); gg.forEach(([g,items])=>{ g.items = items; }); P.queue = q; P.i = qi; renderPlayer(); };
  closeSheet(); V.dig = Math.max(0, V.dig-1); render(); renderPlayer();
  toast(gone.length===1 ? `Deleted “${gone[0].r.title}”` : `Deleted ${gone.length} records`, true);
}
/* Upload to Discogs: first pull the current Discogs collection and keep it as a backup, then queue the adds */
function openDiscogsUpload(){
  const snap = backups().find(b=>b.kind==='discogs');
  openSheet(`<div class="sheet-head"><div><div class="kicker">Two steps, and nothing leaves until step 2</div><h2>Upload to Discogs</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <div class="bcbox"><b style="font-size:14px">1 · Download your Discogs collection and back it up</b>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">So the upload can never lose anything, Crates keeps a copy of what Discogs has <em>before</em> it writes. Load your current CSV export (Collection → Export on discogs.com); it is stored as a backup labelled “Discogs collection before upload”. The full app does this pull itself through the API.</p>
      <div class="row"><label class="btn primary file">Load Discogs CSV export<input type="file" id="dg-pre"></label><button class="btn" data-act="dg-pre-demo">Use the demo snapshot</button>${snap?`<span class="pill ok">Snapshot kept ${fmtWhen(snap.at)}</span>`:''}</div></div>
    <div class="bcbox" style="margin-top:12px;${snap?'':'opacity:.55'}"><b style="font-size:14px">2 · Queue the upload</b>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">Adds the records Discogs doesn’t have yet and writes every spot to the “Location” field. The full app sends them from the server within the 60-requests-a-minute limit; here they wait in the queue (Settings → Sync now).</p>
      <div class="row"><button class="btn ${snap?'primary':''}" data-act="dg-upload" ${snap?'':'disabled'}>Queue upload (${S.records.length} records)</button><span class="muted" style="font-size:13px">${S.syncQueue.filter(q=>q.kind==='add').length} adds waiting</span></div></div>`);
  const inp = $('#dg-pre'); if(inp){ inp.accept='.csv,text/csv'; inp.onchange = e => { const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => { const rows = parseCSV(rd.result); if(rows.length<2){ toast('No records found in that file'); return; } snapshotDiscogs(rows, f.name); }; rd.readAsText(f); }; }
}
function snapshotDiscogs(rows, label){
  const b = backupNow('Discogs collection before upload · '+label, 'discogs');
  if(b){ b.discogsRows = rows.length-1; const list = backups(); list[0].discogsRows = rows.length-1; localStorage.setItem(BK_KEY, JSON.stringify(list)); }
  toast(`Kept a copy of ${rows.length-1} Discogs rows as a backup`); openDiscogsUpload();
}
function queueDiscogsUpload(){
  if(!backups().some(b=>b.kind==='discogs')){ toast('Download and back up your Discogs collection first'); openDiscogsUpload(); return; }
  let n=0; S.records.forEach(r=>{ if(!S.syncQueue.some(q=>q.kind==='add'&&q.r===r.id)){ S.syncQueue.push({kind:'add', r:r.id, value:discogsLocValue(r), status:'pending', at:Date.now()}); n++; } });
  save(); closeSheet(); toast(`${n} records queued for Discogs · Settings → Sync now (demo)`);
}
Object.assign(A, {
  'bk-open':()=>openBackups(),
  'bk-now':()=>{ const b = backupNow('Manual backup'); if(b){ toast('Backed up '+b.records+' records'); openBackups(); } },
  'bk-restore':d=>{ const b = backups().find(x=>x.id===d.b); if(!b) return; $('#bk-confirm').innerHTML = `<div class="notice">Replace the current collection with “${esc(b.label)}” (${b.records} records)? The current one is backed up first. <div class="row" style="margin-top:8px"><button class="btn danger" data-act="bk-restore-yes" data-b="${b.id}">Restore</button><button class="btn" data-act="bk-open">Cancel</button></div></div>`; },
  'bk-restore-yes':d=>restoreBackup(d.b),
  'bk-del':d=>deleteBackup(d.b),
  'col-save':()=>saveCollectionFile(),
  'dg-import':()=>openDiscogsImport(),
  'dg-demo':()=>importDemoDiscogs(),
  'dg-upload':()=>queueDiscogsUpload(),
  'dg-upload-open':()=>openDiscogsUpload(),
  'dg-pre-demo':()=>snapshotDiscogs([['Artist','Title'], ...DEMO_DISCOGS], 'demo snapshot'),
});
