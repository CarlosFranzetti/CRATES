<title>Crates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: the room (drawn furniture) is the home screen; a unit opens into a dig view; the player slides up over everything
   with a spinning record. Display face is reserved for unit names, like record-store divider cards. */
:root{
  --bg:#E8EBED; --surface:#FFFFFF; --surface-2:#F2F4F5; --ink:#121518; --muted:#58616A; --line:#D3D8DC;
  --ok:#17894B; --warn:#B26F05; --bad:#C2352B;
  --accent:#D2412C; --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(18,21,24,.06),0 10px 30px rgba(18,21,24,.08);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --player-h:76px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#171A1E; --surface-2:#1F2328; --ink:#E8EBED; --muted:#98A1A9; --line:#2A3036;
  --ok:#3CC47A; --warn:#E6A23C; --bad:#F06A5E; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#171A1E; --surface-2:#1F2328; --ink:#E8EBED; --muted:#98A1A9; --line:#2A3036;
  --ok:#3CC47A; --warn:#E6A23C; --bad:#F06A5E; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}
body[data-accent="brass"]{--accent:#B8862F;--accent-ink:#1A1206}
body[data-accent="cyan"]{--accent:#0EA5E9;--accent-ink:#04121A}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--player-h) + 30px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto}
.code{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.tabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.icon-btn svg{width:18px;height:18px}
.add-btn{height:38px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.search{position:relative;flex:1 1 100%;order:3}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px}
.search>svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:52px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;max-height:70vh;overflow-y:auto}
.result{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result:hover,.result.active{background:var(--surface-2)}
.t{min-width:0}
.t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- location chip ---------- */
.loc{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:4px 9px 4px 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.loc .mini{display:grid;gap:1.5px;padding:2px;background:#C9B48F;border-radius:2px}
.loc .mini i{width:5px;height:5px;background:var(--surface);display:block}
.loc .mini i.on{background:var(--accent)}
.loc .bagdot{width:12px;height:10px;border-radius:3px 3px 4px 4px;background:#26292D;border-top:3px solid var(--accent)}
.loc.home{background:none;border-style:dashed;color:var(--muted)}

/* ---------- headings ---------- */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.kicker{font-size:13px;color:var(--muted);margin-bottom:4px}

/* ---------- room ---------- */
.room{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.unit-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:14px;text-align:left;box-shadow:var(--shadow);transition:border-color .15s}
.unit-card:hover{border-color:var(--accent)}
.unit-card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.unit-card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.unit-card .sub{font-size:12.5px;color:var(--muted)}
.idtag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--bg);letter-spacing:.04em}
.stage-box{display:grid;place-items:end center;min-height:150px;padding-top:6px}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}

/* ---------- Kallax / cube shelving ---------- */
.kallax{--fin:#EEECE6;--g:7px;display:grid;gap:var(--g);padding:var(--g);width:100%;border-radius:3px;position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 18%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18)),
    var(--grain,none),
    var(--fin);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -3px 0 color-mix(in srgb,var(--fin) 70%,#000) inset,0 3px 0 color-mix(in srgb,var(--fin) 60%,#000),0 12px 18px -8px rgba(0,0,0,.35)}
.kallax.grain{--grain:repeating-linear-gradient(92deg,rgba(90,60,30,.07) 0 2px,rgba(255,255,255,0) 2px 7px,rgba(90,60,30,.05) 7px 8px,rgba(255,255,255,0) 8px 15px)}
.kallax.gloss::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(115deg,rgba(255,255,255,.45) 0 12%,rgba(255,255,255,0) 22% 100%);pointer-events:none}
.kallax.ledge{--g:5px;background:none;box-shadow:none;padding:0;gap:16px 8px}
.kallax.ledge .cube{background:none;box-shadow:none;border-bottom:7px solid var(--fin);filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.cube{aspect-ratio:1;position:relative;display:flex;align-items:flex-end;gap:2px;padding:12% 8% 0;overflow:hidden;border:0;border-radius:1px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fin) 45%,#000) 0%,color-mix(in srgb,var(--fin) 72%,#000) 55%,color-mix(in srgb,var(--fin) 82%,#000) 100%);
  box-shadow:inset 0 10px 14px -6px rgba(0,0,0,.55),inset 8px 0 12px -8px rgba(0,0,0,.45),inset -6px 0 10px -8px rgba(0,0,0,.3)}
.cube .lbl{position:absolute;top:5px;left:6px;font-family:var(--f-mono);font-size:10px;color:rgba(255,255,255,.75);line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.cube .cnt{position:absolute;top:5px;right:6px;font-family:var(--f-mono);font-size:10px;color:rgba(255,255,255,.75);line-height:1}
.kallax.ledge .cube .lbl,.kallax.ledge .cube .cnt{color:var(--muted);text-shadow:none}
.spine{flex:0 0 auto;width:var(--sw,6px);height:var(--h,88%);border-radius:1px 1px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 35%,rgba(0,0,0,.28)),var(--c);box-shadow:1px 0 0 rgba(0,0,0,.35)}
.spine.lean{transform:rotate(-8deg);transform-origin:bottom left}
.kallax.big{--g:10px}
.kallax.big .cube{cursor:pointer;--sw:9px}
.kallax.big .cube .lbl,.kallax.big .cube .cnt{font-size:12.5px;top:8px}
.kallax.big .cube .lbl{left:9px}.kallax.big .cube .cnt{right:9px}
.kallax.big .cube[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.cube.flash{animation:flash 1.1s ease 2}
@keyframes flash{50%{box-shadow:inset 0 0 0 5px var(--accent)}}

/* ---------- bags (textured) ---------- */
.bagwrap{width:100%;display:grid;place-items:end center;padding-top:26px}
.bag{--bc:#22262B;position:relative;width:min(100%,250px);aspect-ratio:5/3.7;border-radius:12px 12px 16px 16px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,0) 1px 3px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.12) 0 1px,rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.28)),var(--bc);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),0 14px 18px -10px rgba(0,0,0,.55)}
.bag.canvas{background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.18)),var(--bc)}
.bag.metal{border-radius:8px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,rgba(0,0,0,.04) 1px 2px),linear-gradient(180deg,#fff0,rgba(0,0,0,.25)),var(--bc);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),inset 0 -5px 0 rgba(0,0,0,.3),0 14px 18px -10px rgba(0,0,0,.55)}
.bag .stitch{position:absolute;inset:7px;border:1.5px dashed rgba(255,255,255,.22);border-radius:9px 9px 12px 12px;pointer-events:none}
.bag.metal .stitch{border:0}
.bag.board{border-radius:6px;background:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.3)),var(--bc);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.3),0 14px 18px -10px rgba(0,0,0,.55)}
.bag.board .stitch{border:0;border-top:3px solid rgba(190,195,200,.75);inset:46% 0 auto 0;border-radius:0}
.kallax.bin .cube{aspect-ratio:1.5;padding-top:6%}
.kallax.bin .spine{transform:rotate(-14deg);transform-origin:bottom left}
.sw.custom{position:relative}
.sw.custom i{background:conic-gradient(#e4572e,#f4d35e,#2ec4b6,#2e5eaa,#9b2335,#e4572e)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bag .corner{position:absolute;width:16px;height:16px;background:linear-gradient(135deg,#d9dde0,#8b9196);border-radius:3px}
.bag .flap{position:absolute;left:-3%;right:-3%;top:-8px;height:44%;border-radius:12px 12px 7px 7px;background:inherit;filter:brightness(1.15);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.bag .flap::after{content:"";position:absolute;inset:6px;border:1.5px dashed rgba(255,255,255,.22);border-radius:8px 8px 4px 4px}
.bag .handle{position:absolute;left:31%;right:31%;top:-26px;height:28px;border:6px solid var(--bc);border-bottom:0;border-radius:16px 16px 0 0;filter:brightness(.85)}
.bag .strap{position:absolute;left:4%;top:12%;width:6px;height:80%;background:rgba(0,0,0,.35);border-radius:3px}
.bag .tag{position:absolute;left:50%;top:22%;transform:translateX(-50%) rotate(-2deg);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:3px;z-index:3;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.bag .peek{position:absolute;left:12%;right:12%;bottom:14%;height:30%;display:flex;gap:2px;align-items:flex-end;z-index:1}
.bag .peek .spine{height:100%}
.bag.backpack{aspect-ratio:3.6/4.4;width:min(70%,170px);border-radius:40px 40px 16px 16px}
.bag.backpack .flap{border-radius:40px 40px 10px 10px;height:38%}
.bag.backpack .handle{left:38%;right:38%}
.bag .wheels{position:absolute;bottom:-9px;left:10%;right:10%;display:flex;justify-content:space-between}
.bag .wheels i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#666 0 25%,#111 27%);display:block}
.bag .bar{position:absolute;top:-46px;left:28%;right:28%;height:48px;border:4px solid #8b9196;border-bottom:0;border-radius:4px 4px 0 0}
.bag.tote{border-radius:4px 4px 10px 10px;aspect-ratio:4/4.2;width:min(78%,190px)}
.bag.tote .handle{left:22%;right:22%;top:-34px;height:36px;border-width:5px;border-radius:30px 30px 0 0}

/* ---------- crates / boxes ---------- */
.cratewrap{width:min(100%,250px);position:relative;padding-top:22px}
.crate-in{position:absolute;left:8%;right:8%;top:6px;height:46%;display:flex;gap:2px;align-items:flex-end}
.crate-in .spine{height:100%}
.crate-face{position:relative;width:100%;aspect-ratio:5/3.2;border-radius:6px;overflow:hidden;box-shadow:0 14px 18px -10px rgba(0,0,0,.5)}
.crate-face svg{display:block;width:100%;height:100%}

/* ---------- unit detail ---------- */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--shadow)}
.detail-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.detail-head h2{margin:2px 0 6px;font-family:var(--f-display);font-weight:800;font-size:36px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.back{border:0;background:none;padding:0;color:var(--muted);font-weight:600;font-size:13px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;margin-top:16px}
@media (max-width:780px){.detail-grid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface-2);padding:6px 11px;border-radius:999px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.code{font-family:var(--f-mono);font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- dig ---------- */
.dig{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;height:clamp(230px,60vw,320px);touch-action:pan-y;user-select:none;overflow-x:clip}
.sleeve{position:absolute;top:0;left:50%;width:clamp(200px,54vw,292px);aspect-ratio:1;border-radius:3px;overflow:hidden;box-shadow:0 16px 32px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;background:var(--surface-2)}
.sleeve svg{width:100%;height:100%;display:block}
.sleeve .txt{position:absolute;left:12px;right:12px;bottom:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:1.02}
.sleeve .txt span{display:block;font-size:13px;letter-spacing:.06em;opacity:.9}
.sleeve .txt b{display:block;font-size:25px}
@media (prefers-reduced-motion:reduce){.sleeve{transition:none}}
.dig-nav{display:flex;align-items:center;justify-content:center;gap:16px}
.dig-info h3{margin:0;font-size:23px;font-weight:600;line-height:1.2;text-wrap:balance}
.dig-info .by{font-size:16px;color:var(--muted);margin-top:2px}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted);align-items:center}
.facts b{color:var(--ink);font-weight:500}
.edited{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tagchip{font-size:12px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li.cur{background:var(--surface-2)}
.thumb{width:40px;height:40px;border-radius:3px;overflow:hidden;display:block;flex:0 0 auto}
.thumb svg{width:100%;height:100%;display:block}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:780px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
@media (prefers-reduced-motion:reduce){.sheet,.np-sheet{animation:none!important}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:27px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.target{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.target .name{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.tgrid{display:grid;gap:4px;padding:4px;background:#C9B48F;border-radius:3px}
.tgrid button{aspect-ratio:1.25;border:0;background:var(--surface);font-family:var(--f-mono);font-size:12px;color:var(--ink);border-radius:2px}
.tgrid button:hover,.tgrid button.sel{background:var(--accent);color:var(--accent-ink)}
.tgrid button.here{background:repeating-linear-gradient(45deg,var(--surface) 0 4px,var(--line) 4px 6px);color:var(--muted);cursor:default}
.tgrid button.homeslot{box-shadow:inset 0 0 0 2px var(--accent)}
.tbag{height:56px;border-radius:9px 9px 11px 11px;border:0;background:#26292D;color:#fff;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:16px;border-top:6px solid var(--accent)}
.tbag.here{opacity:.4;cursor:default}
.tbag.sel{outline:3px solid var(--accent);outline-offset:2px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f .lab{display:flex;justify-content:space-between;gap:8px;align-items:center}
label.f input,label.f select,textarea{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:15px;color:var(--ink);font-weight:400;width:100%;min-width:0}
textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.revert{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:0}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11.5px;color:var(--muted);width:64px;text-align:center}
.sw i{width:38px;height:38px;border-radius:50%;display:block;border:2px solid var(--line);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18)}
.sw[aria-pressed="true"] i{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw[aria-pressed="true"]{color:var(--ink);font-weight:600}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:22px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center;margin-top:6px}
.kv input{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0}

/* ---------- catalogs (presets) ---------- */
.pfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.preset{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.preset .pv{height:96px;display:grid;place-items:end center;overflow:hidden}
.preset .pv>*{transform:scale(.62);transform-origin:bottom center}
.preset b{font-size:13.5px;font-weight:600;line-height:1.25}
.preset span{font-size:12px;color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.preview{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;place-items:end center;min-height:180px;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.choice button{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.choice button b{font-size:17px}
.choice button span{color:var(--muted);font-size:13.5px}
.choice .ico{height:70px;display:grid;place-items:end start}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--player-h) + 28px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:700}

/* ---------- mini player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.player-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center}
.pinfo{min-width:0;border:0;background:none;text-align:left;padding:0}
.pinfo b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtns{display:flex;gap:6px;align-items:center}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;text-decoration:none;flex:0 0 auto}
.round.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;width:50px;height:50px}
.round.xl{width:64px;height:64px}
.round svg{width:18px;height:18px}
.round.xl svg{width:24px;height:24px}
.round:disabled{opacity:.4}
.progress{height:3px;background:var(--line);position:absolute;left:0;right:0;top:0}
.progress i{display:block;height:100%;background:var(--accent);width:0}
#yt-host{position:fixed;left:-420px;bottom:0;width:320px;height:180px;overflow:hidden;opacity:0;pointer-events:none}

/* ---------- vinyl (ported look from discogs-stream MobileAlbumCover) ---------- */
.vinyl{position:relative;aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#131313 0 1.1px,#1c1c1c 1.1px 2.3px);
  box-shadow:0 0 0 2px #0a0a0a,0 22px 50px rgba(0,0,0,.45)}
.vinyl .disc{position:absolute;inset:0;border-radius:50%}
.vinyl .g{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.vinyl .lab{position:absolute;inset:31%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.05)}
.vinyl .lab svg{width:100%;height:100%;display:block}
.vinyl .hole{position:absolute;inset:48.4%;border-radius:50%;background:#c9cdd1;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.vinyl .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.11) 30deg,rgba(255,255,255,0) 60deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.08) 215deg,rgba(255,255,255,0) 250deg)}
.vinyl.spin .disc{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px #0a0a0a,0 0 34px 6px color-mix(in srgb,var(--accent) 45%,transparent),0 22px 50px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.vinyl.spin .disc,.vinyl.glow{animation:none}}
.mini-vinyl{width:54px;height:54px}

/* ---------- slide-up player ---------- */
.np-scrim{position:fixed;inset:0;z-index:55;background:rgba(5,7,9,.55)}
.np-sheet{position:fixed;left:0;right:0;bottom:0;top:max(18px,env(safe-area-inset-top,0px));z-index:56;background:var(--surface);border-radius:22px 22px 0 0;overflow:auto;
  padding-block:10px calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:slide .38s cubic-bezier(.2,.85,.2,1);box-shadow:0 -14px 40px rgba(0,0,0,.35)}
@keyframes slide{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px;border:0;display:block}
.np-wrap{max-width:860px;margin:0 auto}
.deck{position:relative;width:min(78vw,380px);margin:8px auto 0;padding:16px;border-radius:22px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--surface-2) 80%,#fff),var(--surface-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px rgba(0,0,0,.12);border:1px solid var(--line)}
.arm{position:absolute;right:4%;top:6%;width:34%;height:72%;pointer-events:none;transform-origin:78% 12%;transform:rotate(-24deg);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.arm.on{transform:rotate(2deg)}
@media (prefers-reduced-motion:reduce){.arm{transition:none}}
.np-meta{text-align:center;margin-top:18px}
.np-meta h3{margin:0;font-size:27px;font-weight:700;line-height:1.15;text-wrap:balance}
.np-meta .by{font-size:18px;color:var(--muted);margin-top:2px}
.np-ctrl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:16px}
.scrub{height:4px;background:var(--line);border-radius:2px;margin:16px auto 4px;max-width:420px;overflow:hidden}
.scrub i{display:block;height:100%;background:var(--accent);width:0}
.np-tabs{display:flex;gap:4px;margin:22px 0 10px;border-bottom:1px solid var(--line)}
.np-tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.np-tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px}
.notice b{font-weight:600}
.links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.link{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.try{background:var(--warn);animation:pulse 1s infinite}.dot.pend{background:transparent;border:2px solid var(--muted)}
@keyframes pulse{50%{opacity:.35}}
.chain{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.chain li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:7px 8px;border-radius:8px;font-size:13.5px;counter-increment:s}
.chain li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.chain li.on{background:var(--surface-2)}
.chain li.on::before{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chain li.done::before{content:"✓";color:var(--ok)}
.chain li.fail::before{content:"✕";color:var(--bad)}
.log{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:8px;max-height:120px;overflow:auto;white-space:pre-wrap}
.pl button.pli{display:grid;grid-template-columns:16px 50px minmax(0,1fr);gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 4px;text-align:left}
.pl .pli .thumb{width:50px;height:50px}
.pl .pli .t b{font-size:20px;line-height:1.2}
.pl .pli .t span{font-size:15.5px}
.pl .pli.cur .t b{color:var(--accent)}
.pl .pli.bad{opacity:.5}

/* ---------- playlists ---------- */
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.plcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.plcard::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--pc)}
.plcard .covers{display:flex}
.plcard .covers .thumb{width:48px;height:48px;margin-right:-12px;box-shadow:0 0 0 2px var(--surface)}
.plcard b{font-size:18px}
.plcard span{color:var(--muted);font-size:13px}
.pledit{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--shadow)}
.plname{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.02em;border:0;border-bottom:2px dashed transparent;background:none;width:100%;padding:2px 0;line-height:1.1}
.plname:hover,.plname:focus{border-bottom-color:var(--line);outline:none}
.items{margin-top:12px;border-top:1px solid var(--line);touch-action:pan-y}
.item{display:grid;grid-template-columns:28px 22px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);background:var(--surface)}
.item.dragging{background:var(--surface-2);box-shadow:0 8px 20px rgba(0,0,0,.15);position:relative;z-index:2}
.handle{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);display:grid;place-items:center;height:36px}
.handle svg{width:18px;height:18px}
.item .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.item .thumb{width:44px;height:44px}
.item .t b{font-size:16px}
.item .acts{display:flex;gap:2px}
.mini-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted)}
.mini-btn:hover{border-color:var(--line);color:var(--ink)}
.mini-btn svg{width:15px;height:15px}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:50vh;overflow:auto}
.pick label{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.diff{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.diff .d{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.diff .d .t{display:flex;flex-direction:column;gap:6px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:600}
.pill.in{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.out{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.foot{margin-top:34px;font-size:12.5px;color:var(--muted);max-width:72ch}
</style>

const PAL = [['#E4572E','#F3DFC1','#1B1B1E'],['#2E5EAA','#F2E8CF','#E8B04A'],['#0B6E4F','#F4D35E','#101419'],['#9B2335','#EFE6DD','#2D2A32'],['#F25F5C','#247BA0','#FFF8E8'],['#3D2C8D','#F0A6CA','#FAF3DD'],['#D7263D','#F5F5F0','#1A1A1A'],['#FF9F1C','#2EC4B6','#011627'],['#5F0F40','#FB8B24','#F4E9D8'],['#283618','#DDA15E','#FEFAE0']];
const PL_COLORS = ['#D2412C','#0EA5E9','#B8862F','#17894B','#7C3AED','#DB2777'];
const GRADES = ['','M','NM','VG+','VG','G+','G','F','P'];

const SEED_K = pickPreset(FURNITURE, x=>/kallax/i.test(x.name+x.brand)&&x.rows===2&&x.cols===4, 'kallax-2x4');
const SEED_C = pickPreset(FURNITURE, x=>x.style==='milk', 'milk-crate');
const SEED_B = pickPreset(BAGS, x=>x.brand==='UDG'&&/softbag 60|record bag 60/i.test(x.name), 'udg-ultimate-60');
function seed(){
  const R = (id,artist,title,label,year,style,yt,cell,home,p) => {
    const loc = cell==='bag' ? {u:'B1',c:'0-0'} : {u:'K1',c:cell};
    return {id,artist,title,label,catno:'',year,style,yt,loc,home:{u:'K1',c:home||cell},pal:PAL[p],pat:p%6,
      bpm:'',key:'',rating:0,cm:'',cs:'',notes:'',tags:[],custom:[],orig:{artist,title,label,catno:'',year,style}};
  };
  return {
    v:2,
    units:[
      {id:'K1',name:'Kallax 1',preset:SEED_K,kind:'shelf',rows:2,cols:4,finish:finishesFor(fpreset(SEED_K))[0],photo:null},
      {id:'B1',name:'Crater',preset:SEED_B,kind:'bag',rows:1,cols:1,finish:bpreset(SEED_B).colors[0],photo:null},
      {id:'C1',name:'Milk crate',preset:SEED_C,kind:'crate',rows:1,cols:1,finish:finishesFor(fpreset(SEED_C)).find(f=>/blue/i.test(f.name))||finishesFor(fpreset(SEED_C))[0],photo:null},
    ],
    records:[
      R('r9',"Model 500","No UFO's",'Metroplex',1985,'Electro',['UHja6QCvwRc','EarSRa19sZc','XtkpjkpD8xQ'],'0-0',null,0),
      R('r2','Rhythim Is Rhythim','Strings Of Life','Transmat',1987,'Detroit Techno',['5oMUQKLzXH4','Hu3qPCAWgNg','jNREVOeGI5w'],'0-0',null,1),
      R('r1','Mr. Fingers','Can You Feel It','Trax Records',1986,'Deep House',['AG040c9mkbg','1N9Wnqz8Rh8','Z1LAAenjlIw','SjTpxkvtRhA'],'0-0',null,2),
      R('r6','Joey Beltram','Energy Flash','R&S Records',1990,'Techno',['AvqUnGKk7F8','maOM81a-Gyg','awdWUt7sI5I'],'0-0',null,3),
      R('r3','Phuture','Acid Tracks','Trax Records',1987,'Acid House',['RbJTxipRrRY','QZSd2pP2dms','8P7w7waKT-0'],'0-0',null,4),
      R('r8','Josh Wink','Higher State Of Consciousness','Strictly Rhythm',1995,'Acid Techno',['d3hAnAnJwyU','1Z9mhK8Liqg','Ldfc68bxlB8'],'0-1',null,5),
      R('r7','808 State','Pacific State','ZTT',1989,'Acid House',['6jQ_bOP0HfY','Tv0UiQ5n7SM','rtUf9fDgtV0'],'0-1',null,6),
      R('r4','Inner City','Good Life','10 Records',1988,'Detroit House',['M4_fMRNVvqA','EC40LAcZGkE','cPPRw5Ad86c'],'bag','0-1',7),
      R('r5','A Guy Called Gerald','Voodoo Ray','Rham!',1988,'Acid House',['UwXSsNAtGTU','BEGRBp8-fvY'],'bag','0-0',8),
      R('r10','Daft Punk','Around The World','Virgin',1997,'French House',['K0HSD_i2DvA','LKYPYj2XX80','T0lxekHV0qU'],'bag','0-1',9),
    ],
    playlists:[
      {id:'p1',name:'Warm-up',color:PL_COLORS[1],items:['r1','r4','r7','r8']},
      {id:'p2',name:'Acid hour',color:PL_COLORS[0],items:['r3','r5','r8','r6']},
    ],
    settings:{accent:'red'},
    recent:[]
  };
}

/* ---------- state ---------- */
const KEY='crates-demo-v3';
let S; try{ S = JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!S || S.v!==2 || !S.units.every(u=>u.kind==='bag'?bpreset(u.preset):fpreset(u.preset))) S = seed();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} };
const V = {view:'unit', unit:'K1', cell:'0-0', dig:0, focus:null, flash:null, pl:null};
let AI = null, AI_IMAGES = false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unit = id => S.units.find(u => u.id === id);
const rec = id => S.records.find(r => r.id === id);
const fpreset = k => FURNITURE.find(p=>p.key===k);
const bpreset = k => BAGS.find(p=>p.key===k);
const presetOf = u => u.kind==='bag' ? (bpreset(u.preset)||BAGS[0]) : (fpreset(u.preset)||FURNITURE[0]);
const presetName = u => { const p = presetOf(u); return u.kind==='bag' ? p.brand+' '+p.name : p.name; };
const finishesFor = p => p.form ? p.colors : (p.finishes?.length ? p.finishes : (FINISHES[p.style] || FINISHES.cube));
const cellKeys = u => { const a=[]; for(let r=0;r<u.rows;r++) for(let c=0;c<u.cols;c++) a.push(r+'-'+c); return a; };
const rowLetter = r => r<26 ? String.fromCharCode(65+r) : 'A'+String.fromCharCode(65+r-26);
function cellLabel(u, key){ if(!u || u.kind!=='shelf') return ''; const [r,c] = key.split('-').map(Number); return rowLetter(r)+(c+1); }
function addrShort(loc){ const u=unit(loc?.u); if(!u) return 'Unplaced'; return u.kind==='shelf' ? u.id+'·'+cellLabel(u,loc.c) : u.name; }
function addrLong(loc){ const u=unit(loc?.u); if(!u) return 'Unplaced';
  if(u.kind==='shelf') return u.name+', shelf '+cellLabel(u,loc.c);
  return (u.kind==='bag'?'Bag':'Crate')+' “'+u.name+'”'; }
const same = (a,b) => a && b && a.u===b.u && a.c===b.c;
const hasHome = r => !!(r.home && unit(r.home.u)?.kind==='shelf');
const inCell = (u,c) => S.records.filter(r => r.loc.u===u && (c==='all' || r.loc.c===c));
const discogsUrl = r => 'https://www.discogs.com/search/?q='+encodeURIComponent(r.artist+' '+r.title)+'&type=all';
const ytUrl = id => 'https://www.youtube.com/watch?v='+id;
const ytSearch = r => 'https://www.youtube.com/results?search_query='+encodeURIComponent(r.artist+' '+r.title);
function hash(s){ let h=0; for(const ch of String(s)) h=(Math.imul(31,h)+ch.charCodeAt(0))>>>0; return h; }
const uid = p => p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);

function cover(r){
  const [a,b,c] = r.pal; let g='';
  switch(r.pat){
    case 0: g=`<rect width="100" height="100" fill="${b}"/>${[44,34,24,14].map((rad,i)=>`<circle cx="50" cy="42" r="${rad}" fill="${i%2?b:a}"/>`).join('')}<circle cx="50" cy="42" r="5" fill="${c}"/>`; break;
    case 1: g=`<rect width="100" height="100" fill="${c}"/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${i*14-20}" y="-10" width="7" height="140" fill="${i%2?a:b}" transform="rotate(30 50 50)"/>`).join('')}`; break;
    case 2: g=`<rect width="100" height="100" fill="${a}"/><rect width="100" height="46" fill="${b}"/><rect x="8" y="8" width="30" height="30" fill="${c}"/>`; break;
    case 3: g=`<rect width="100" height="100" fill="${b}"/>${Array.from({length:36},(_,i)=>`<circle cx="${10+(i%6)*16}" cy="${8+Math.floor(i/6)*12}" r="${3+((i*7)%5)}" fill="${i%3?a:c}"/>`).join('')}`; break;
    case 4: g=`<rect width="100" height="100" fill="${c}"/><circle cx="70" cy="30" r="40" fill="${a}"/><rect y="62" width="100" height="38" fill="${b}"/>`; break;
    default: g=`<rect width="100" height="100" fill="${b}"/>${[0,1,2,3,4,5].map(i=>`<rect x="${6+i*15}" y="${10+i*6}" width="9" height="${60-i*6}" fill="${i%2?c:a}"/>`).join('')}`;
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sh${r.id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient></defs>${g}<rect width="100" height="100" fill="url(#sh${r.id})"/></svg>`;
}
const thumb = r => `<span class="thumb">${cover(r)}</span>`;

function locChip(loc, cls=''){
  const u = unit(loc?.u); if(!u) return `<span class="loc ${cls}">Unplaced</span>`;
  const ic = u.kind==='shelf'
    ? `<span class="mini" style="grid-template-columns:repeat(${u.cols},5px)">${cellKeys(u).map(k=>`<i class="${k===loc.c?'on':''}"></i>`).join('')}</span>`
    : `<span class="bagdot" style="background:${esc(u.finish?.hex||'#26292D')}"></span>`;
  return `<span class="loc ${cls}" title="${esc(addrLong(loc))}">${ic}${esc(addrShort(loc))}</span>`;
}

/* ---------- drawing ---------- */
function spines(list, max=40, lean=true){
  return list.slice(0,max).map((r,i)=>`<span class="spine ${lean&&list.length<5&&list.length>1&&i===list.length-1?'lean':''}" style="--c:${r.pal[0]};--h:${84+hash(r.id)%10}%"></span>`).join('');
}
function drawShelf(u, big=false, opts={}){
  const p = fpreset(u.preset) || {style:'cube'};
  const f = u.finish || FINISHES.cube[0];
  const cls = ['kallax', big?'big':'', p.style==='ledge'?'ledge':'', p.style==='bin'?'bin':'', f.grain?'grain':'', f.gloss?'gloss':''].join(' ');
  return `<div class="${cls}" style="grid-template-columns:repeat(${u.cols},1fr);--fin:${f.hex};max-width:${Math.min(100, u.cols*(big?26:22))}%">${cellKeys(u).map(k=>{
    const list = opts.empty ? [] : inCell(u.id,k);
    const inner = `<span class="lbl">${esc(cellLabel(u,k))}</span>${list.length?`<span class="cnt">${list.length}</span>`:''}${spines(list)}`;
    return big ? `<button type="button" class="cube ${V.flash===k?'flash':''}" data-act="pick-cell" data-c="${k}" aria-pressed="${V.cell===k}" aria-label="Shelf ${esc(cellLabel(u,k))}, ${list.length} records">${inner}</button>` : `<div class="cube">${inner}</div>`;
  }).join('')}</div>`;
}
function drawBag(u, opts={}){
  const p = bpreset(u.preset) || BAGS[0];
  const hex = u.finish?.hex || p.colors[0].hex;
  const list = opts.empty ? [] : inCell(u.id,'all');
  const mat = p.texture || (p.material==='canvas'?'canvas':p.material==='aluminum'?'metal':'nylon');
  const form = p.form;
  let extra = '';
  if(form==='case') extra = `<i class="corner" style="left:-3px;top:-3px"></i><i class="corner" style="right:-3px;top:-3px"></i><i class="corner" style="left:-3px;bottom:-3px"></i><i class="corner" style="right:-3px;bottom:-3px"></i><span class="handle" style="border-color:#8b9196"></span>`;
  else if(form==='tote') extra = `<span class="handle"></span>`;
  else if(form==='trolley') extra = `<span class="flap"></span><span class="bar"></span><span class="wheels"><i></i><i></i></span>`;
  else if(form==='backpack') extra = `<span class="flap"></span><span class="handle"></span>`;
  else if(form==='sling') extra = `<span class="flap"></span><span class="strap"></span>`;
  else extra = `<span class="flap"></span><span class="handle"></span>`;
  const cls = ['bag', mat, form==='backpack'?'backpack':'', form==='tote'?'tote':''].join(' ');
  return `<div class="bagwrap"><div class="${cls}" style="--bc:${esc(hex)};${form==='trolley'?'margin-top:26px':''}">${extra}<span class="stitch"></span>${opts.noTag?'':`<span class="tag">${esc(u.name)}</span>`}<div class="peek">${spines(list,40,false)}</div></div></div>`;
}
function drawCrate(u, opts={}){
  const p = fpreset(u.preset) || {style:'milk'};
  const hex = u.finish?.hex || '#1F5FBF';
  const list = opts.empty ? [] : inCell(u.id,'all');
  const pid = 'cp'+hash(u.id+hex+(opts.empty?'e':''));
  let face;
  if(p.style==='milk') face = `<svg viewBox="0 0 250 160" preserveAspectRatio="none" aria-hidden="true"><defs>
      <pattern id="${pid}" width="22" height="18" patternUnits="userSpaceOnUse"><rect width="22" height="18" fill="${hex}"/><rect x="4" y="4" width="14" height="10" rx="3" fill="rgba(0,0,0,.45)"/><rect x="4" y="4" width="14" height="3" rx="1.5" fill="rgba(0,0,0,.25)"/></pattern>
      <linearGradient id="${pid}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
      <rect width="250" height="160" fill="url(#${pid})"/><rect width="250" height="16" fill="${hex}"/><rect y="144" width="250" height="16" fill="${hex}"/><rect width="14" height="160" fill="${hex}"/><rect x="236" width="14" height="160" fill="${hex}"/><rect x="90" y="22" width="70" height="20" rx="10" fill="rgba(0,0,0,.5)"/><rect width="250" height="160" fill="url(#${pid}g)"/></svg>`;
  else if(p.style==='wood') face = `<svg viewBox="0 0 250 160" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${pid}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient></defs>
      <rect width="250" height="160" fill="rgba(0,0,0,.55)"/>${[0,1,2].map(i=>`<rect y="${6+i*52}" width="250" height="44" rx="2" fill="${hex}"/><path d="M0 ${18+i*52} Q 60 ${14+i*52} 125 ${20+i*52} T 250 ${16+i*52}" stroke="rgba(0,0,0,.12)" fill="none"/>`).join('')}<rect width="250" height="160" fill="url(#${pid}g)"/></svg>`;
  else face = `<svg viewBox="0 0 250 160" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${pid}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs><rect width="250" height="160" fill="${hex}"/>${Array.from({length:40},(_,i)=>`<rect y="${i*4}" width="250" height="1" fill="rgba(255,255,255,.07)"/>`).join('')}<rect x="6" y="6" width="238" height="148" rx="4" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="4"/>${[[0,0],[226,0],[0,136],[226,136]].map(([x,y])=>`<rect x="${x}" y="${y}" width="24" height="24" rx="4" fill="#9aa0a5"/>`).join('')}<rect x="95" y="70" width="60" height="12" rx="6" fill="rgba(0,0,0,.5)"/><rect width="250" height="160" fill="url(#${pid}g)"/></svg>`;
  return `<div class="cratewrap"><div class="crate-in">${spines(list,40,false)}</div><div class="crate-face">${face}</div></div>`;
}
function drawUnit(u, big=false, opts={}){
  if(u.kind==='shelf') return drawShelf(u,big,opts);
  if(u.kind==='bag') return drawBag(u,opts);
  return drawCrate(u,opts);
}

/* ---------- render ---------- */
function render(){
  document.body.dataset.accent = S.settings.accent;
  $('#tab-room').setAttribute('aria-pressed', V.view==='room'||V.view==='unit');
  $('#tab-pl').setAttribute('aria-pressed', V.view==='playlists');
  $('#main').innerHTML = V.view==='playlists' ? renderPlaylists() : renderRoom();
  if(V.view==='unit') bindSwipe();
  if(V.view==='playlists') bindPlaylist();
  save();
}

function renderRoom(){
  const cards = S.units.map(u=>{
    const n = inCell(u.id,'all').length;
    return `<button class="unit-card" data-act="open-unit" data-u="${u.id}">
      <div class="meta"><h3>${esc(u.name)}</h3><span class="idtag">${esc(u.id)}</span></div>
      ${u.photo?`<img class="photo" src="${u.photo}" alt="Photo of ${esc(u.name)}">`:`<div class="stage-box">${drawUnit(u)}</div>`}
      <div class="meta"><span class="sub">${esc(presetName(u))} · ${esc(u.finish?.name||'')}</span><span class="sub code">${n} ${n===1?'record':'records'}</span></div>
    </button>`;
  }).join('');
  let html = `<div class="sec-head"><div><div class="kicker">${S.records.length} records in ${S.units.length} places</div><h2>Your room</h2></div>
    <div class="row"><button class="btn" data-act="play-all"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>Play collection</button></div></div>
    <div class="room">${cards}</div>`;
  if(V.view==='unit' && unit(V.unit)) html += renderDetail();
  html += `<p class="foot">Demo collection. Covers are placeholder art; the full app pulls sleeves and metadata from Discogs. ${SRC_NOTE} Changes stay in this browser.</p>`;
  return html;
}

function renderDetail(){
  const u = unit(V.unit);
  const list = inCell(u.id, V.cell);
  V.dig = Math.max(0, Math.min(V.dig, list.length-1));
  if(V.focus){ const i = list.findIndex(r=>r.id===V.focus); if(i>=0) V.dig=i; V.focus=null; }
  const cur = list[V.dig];
  const chips = u.kind==='shelf' ? `<div class="chips" role="group" aria-label="Shelves">
      <button class="chip" data-act="pick-cell" data-c="all" aria-pressed="${V.cell==='all'}">All <small>${inCell(u.id,'all').length}</small></button>
      ${cellKeys(u).map(k=>`<button class="chip code" data-act="pick-cell" data-c="${k}" aria-pressed="${V.cell===k}">${esc(cellLabel(u,k))} <small>${inCell(u.id,k).length}</small></button>`).join('')}</div>` : '';
  const where = V.cell==='all' ? 'All shelves' : 'Shelf '+cellLabel(u,V.cell);
  const bagActs = u.kind==='bag' ? `<button class="btn primary" data-act="scan-bag" data-u="${u.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>Scan bag</button>
      <button class="btn" data-act="empty-bag" data-u="${u.id}">Unpack to home slots</button>` : '';
  return `<section class="detail" aria-label="${esc(u.name)}">
    <div class="detail-head"><div><button class="back" data-act="go-room">← Room</button>
      <h2>${esc(u.name)}</h2><div class="row"><span class="idtag">${esc(u.id)}</span><span class="muted" style="font-size:13px">${esc(presetName(u))} · ${esc(u.finish?.name||'')} · ${esc(presetOf(u).cap||'')}</span></div></div>
      <div class="row">${bagActs}<button class="btn" data-act="play-unit"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>Play ${u.kind==='shelf'&&V.cell!=='all'?esc(cellLabel(u,V.cell)):'all'}</button><button class="btn" data-act="edit-unit" data-u="${u.id}">Look & name</button></div></div>
    <div class="detail-grid">
      <div>${u.photo?`<img class="photo" src="${u.photo}" alt="Photo of ${esc(u.name)}" style="margin-bottom:12px">`:''}<div style="display:grid;place-items:end center">${drawUnit(u,true)}</div>${chips}</div>
      <div class="dig">
        <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px;font-weight:600">${u.kind==='shelf'?esc(where):'Inside '+esc(u.name)}</span><span class="code muted" style="font-size:12px">${list.length?(V.dig+1)+' of '+list.length:'empty'}</span></div>
        ${list.length ? digView(list, cur) : `<div class="empty"><b>${u.kind==='shelf'?esc(where)+' is empty':'Nothing in '+esc(u.name)}</b>Move a record here from any sleeve, or use Add → Record.</div>`}
      </div>
    </div>
  </section>`;
}

function editedSet(r){ return new Set(Object.keys(r.orig||{}).filter(k=>String(r[k]??'')!==String(r.orig[k]??''))); }

function digView(list, cur){
  const sleeves = list.map((r,i)=>{
    const d = i - V.dig; if(Math.abs(d)>2) return '';
    const x = d*26, s = 1 - Math.abs(d)*0.1, z = 10-Math.abs(d), o = Math.abs(d)>1?0.35:1;
    return `<div class="sleeve" style="transform:translateX(calc(-50% + ${x}%)) scale(${s}) rotate(${d*2}deg);z-index:${z};opacity:${o}" ${d?`data-act="dig-to" data-i="${i}"`:''}>${cover(r)}<div class="txt"><span>${esc(r.artist)}</span><b>${esc(r.title)}</b></div></div>`;
  }).join('');
  const atHome = !hasHome(cur) || same(cur.loc, cur.home);
  const bag = S.units.find(u=>u.kind==='bag');
  const inBag = unit(cur.loc.u)?.kind==='bag';
  const ed = editedSet(cur);
  const dot = k => ed.has(k)?'<i class="edited" title="Edited by you"></i>':'';
  return `<div class="stage" id="stage">${sleeves}</div>
    <div class="dig-nav">
      <button class="round" data-act="dig" data-d="-1" aria-label="Previous record" ${V.dig===0?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button>

function bindSwipe(){
  const st = $('#stage'); if(!st) return;
  let x0=null;
  st.onpointerdown = e => { x0 = e.clientX; };

}
function dig(d){ const list = inCell(V.unit,V.cell); if(!list.length) return; V.dig = Math.max(0, Math.min(list.length-1, V.dig+d)); render(); }

let lastUndo = null;
function moveRecord(id, to){
  const r = rec(id); const from = {...r.loc}, fromHome = {...r.home};
  if(same(from,to)) return;
  r.loc = {...to};
  if(unit(to.u)?.kind==='shelf') r.home = {...to};
  S.recent = [to, ...S.recent.filter(l=>!same(l,to))].slice(0,3);
  lastUndo = () => { r.loc = from; r.home = fromHome; };
  closeSheet(); render(); toast(`Moved to ${addrShort(to)}`, true);
}
function targetGrid(u, onAct, dataAttrs, hereLoc, homeLoc, sel){
  if(u.kind!=='shelf'){
    const here = hereLoc && hereLoc.u===u.id, isSel = sel && sel.u===u.id;
    return `<div class="target"><div class="name">${esc(u.name)} <span class="idtag">${u.id}</span></div><button class="tbag ${here?'here':''} ${isSel?'sel':''}" style="background:${esc(u.finish?.hex||'#26292D')}" ${here?'disabled':''} data-act="${onAct}" ${dataAttrs} data-u="${u.id}" data-c="0-0">${here?'Here now':esc(u.name)}</button></div>`;
  }
  return `<div class="target"><div class="name">${esc(u.name)} <span class="idtag">${u.id}</span></div>
    <div class="tgrid" style="grid-template-columns:repeat(${u.cols},1fr);background:${esc(u.finish?.hex||'#C9B48F')}">${cellKeys(u).map(k=>{
      const here = hereLoc && hereLoc.u===u.id && hereLoc.c===k, home = homeLoc && homeLoc.u===u.id && homeLoc.c===k, isSel = sel && sel.u===u.id && sel.c===k;
      return `<button class="${here?'here':''} ${home&&!here?'homeslot':''} ${isSel?'sel':''}" ${here?'disabled':''} data-act="${onAct}" ${dataAttrs} data-u="${u.id}" data-c="${k}" aria-label="${esc(u.name)} ${esc(cellLabel(u,k))}${here?' (current)':''}">${esc(cellLabel(u,k))}</button>`;}).join('')}</div></div>`;
}
function openMove(id){

  if(hasHome(r) && !same(r.loc,r.home)) quick.push({l:r.home,t:'Home · '+addrShort(r.home)});
  S.recent.filter(l=>!same(l,r.loc)&&!same(l,r.home)&&unit(l.u)).forEach(l=>quick.push({l,t:'Recent · '+addrShort(l)}));

/* ---------- bag scan ---------- */
let scan = null;
function openScan(uId){
  scan = {u:uId, found:null, unknown:[], mode:null};
  const u = unit(uId);
  openSheet(`<div class="sheet-head"><div><div class="kicker">Scan ${esc(u.name)}</div><h2>What's in the bag?</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
    <p class="muted" style="margin-top:0">Fan the records out so the sleeves show, then take one photo. Crates matches what it sees to your collection and updates every location at once.</p>
    <div class="row">
      ${AI&&AI_IMAGES?`<label class="btn primary file">Take or choose photo<input type="file" accept="image/*" capture="environment" id="scan-photo"></label>`:''}
      <button class="btn ${AI&&AI_IMAGES?'':'primary'}" data-act="scan-sim">Simulate a scan</button>
    </div>
    ${AI&&AI_IMAGES?'':`<div class="notice">Photo recognition runs when this page can ask Claude about images. Here, try the simulated scan to see the reconcile step.</div>`}
    <div id="scan-out"></div>`);
  const inp = $('#scan-photo'); if(inp) inp.onchange = () => runScanAI(inp.files);
}
async function runScanAI(files){
  if(!files || !files.length) return;
  const out = $('#scan-out'); out.innerHTML = `<div class="notice">Reading the photo…</div>`;
  const listTxt = S.records.map(r=>`${r.id} | ${r.artist} – ${r.title} (${r.label})`).join('\n');
  try{
    const res = await AI.json(`A DJ photographed the open contents of a record bag. Identify which vinyl records are visible (sleeves, center labels or spines).\nTheir collection (id | artist – title (label)):\n${listTxt}\n\nReply with only JSON: {"found":["id",...],"unknown":[{"artist":"...","title":"..."}]}. "found" lists collection ids you can see. "unknown" lists visible records not in the collection. Leave out anything you cannot read.`, {images: files});
    scan.found = new Set((res?.found||[]).map(String).filter(id=>rec(id)));
    scan.unknown = Array.isArray(res?.unknown) ? res.unknown.filter(x=>x&&x.title).slice(0,12) : [];
    scan.mode = 'photo'; renderScanFound();
  }catch(e){
    out.innerHTML = `<div class="notice"><b>Couldn't read that photo.</b> ${e.code==='not_granted'?'Claude access was declined for this page.':e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Try a brighter photo with the sleeves facing the camera.'} You can still use the simulated scan.</div>`;
  }
}
function simScan(){
  const inBag = S.records.filter(r=>r.loc.u===scan.u);
  const others = S.records.filter(r=>r.loc.u!==scan.u);
  const found = new Set(inBag.slice(1).map(r=>r.id));
  others.slice().sort((a,b)=>hash(a.id+Date.now())-hash(b.id+Date.now())).slice(0,2).forEach(r=>found.add(r.id));
  scan.found = found; scan.unknown = []; scan.mode = 'sim'; renderScanFound();
}
function renderScanFound(){
  const u = unit(scan.u);
  const rows = [...S.records].sort((a,b)=>(scan.found.has(b.id)-scan.found.has(a.id))).map(r=>`<label>
      <input type="checkbox" data-scan="${r.id}" ${scan.found.has(r.id)?'checked':''}>${thumb(r)}
      <span class="t"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span>${locChip(r.loc)}</label>`).join('');
  $('#scan-out').innerHTML = `<div class="sec-head" style="margin-top:18px"><div><div class="kicker">${scan.mode==='sim'?'Simulated result':'From your photo'}</div><h2 style="font-size:21px">Found ${scan.found.size} in ${esc(u.name)}</h2></div></div>
    <p class="muted" style="margin:0">Tick anything it missed, untick anything that isn't there.</p>
    <div class="pick">${rows}</div>
    ${scan.unknown.length?`<div class="notice"><b>Not in your collection yet:</b> ${scan.unknown.map(x=>esc((x.artist?x.artist+' – ':'')+x.title)).join(', ')}. Add them with Add → Record.</div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="scan-review">Review changes</button></div>
    <div id="scan-diff"></div>`;
  document.querySelectorAll('[data-scan]').forEach(cb => cb.onchange = () => { cb.checked ? scan.found.add(cb.dataset.scan) : scan.found.delete(cb.dataset.scan); });
}
function scanReview(){
  const goingIn = S.records.filter(r=>scan.found.has(r.id) && r.loc.u!==scan.u);
  const goingOut = S.records.filter(r=>!scan.found.has(r.id) && r.loc.u===scan.u && hasHome(r));
  const homeless = S.records.filter(r=>!scan.found.has(r.id) && r.loc.u===scan.u && !hasHome(r));
  if(!goingIn.length && !goingOut.length && !homeless.length){ $('#scan-diff').innerHTML = `<div class="notice">Everything already matches. Nothing to move.</div>`; return; }
  $('#scan-diff').innerHTML = `<div class="diff">
    ${goingIn.map(r=>`<div class="d">${thumb(r)}<div class="t"><b>${esc(r.title)} <span class="muted" style="font-weight:400">· ${esc(r.artist)}</span></b><div class="row"><span class="pill in">Into bag</span>${locChip(r.loc)}<span class="muted">→</span>${locChip({u:scan.u,c:'0-0'})}</div></div></div>`).join('')}
    ${goingOut.map(r=>`<div class="d">${thumb(r)}<div class="t"><b>${esc(r.title)} <span class="muted" style="font-weight:400">· ${esc(r.artist)}</span></b><div class="row"><span class="pill out">Not in bag</span><span class="muted">→</span>${locChip(r.home)}<span class="muted" style="font-size:12px">its home slot</span></div></div></div>`).join('')}
  </div>${homeless.length?`<div class="notice">${homeless.length} unticked record${homeless.length>1?'s have':' has'} no home shelf yet, so ${homeless.length>1?'they stay':'it stays'} listed in the bag: ${homeless.map(r=>esc(r.title)).join(', ')}.</div>`:''}<div class="row" style="margin-top:14px"><button class="btn primary" data-act="scan-apply">Update ${goingIn.length+goingOut.length} locations</button></div>`;
}
function scanApply(){
  const moves = [];
  S.records.forEach(r=>{
    if(scan.found.has(r.id) && r.loc.u!==scan.u){ moves.push([r,{...r.loc}]); r.loc={u:scan.u,c:'0-0'}; }
    else if(!scan.found.has(r.id) && r.loc.u===scan.u && hasHome(r)){ moves.push([r,{...r.loc}]); r.loc={...r.home}; }
  });
  lastUndo = () => moves.forEach(([r,l])=>r.loc=l);
  closeSheet(); render(); toast(`${unit(scan.u).name} updated · ${moves.length} moved`, true);
}

async function identifyShelf(files){
  if(!files?.length) return;
  const out = $('#ar-out'); out.innerHTML = `<div class="notice">Reading the sleeves…</div>`;

    const res = await AI.json(`This photo shows vinyl records on a DJ's shelf, in a crate or in a bag — sleeves, center labels or spines. List every record you can actually read. Reply with only a JSON array like [{"artist":"...","title":"...","label":"...","year":1990,"confidence":"high"}]. Use null for fields you cannot read and "low" confidence when unsure. Never invent records you cannot see.`, {images: files});

function shrink(file){ return new Promise(res=>{ const img = new Image(); img.onload=()=>{ const s = Math.min(1, 900/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); URL.revokeObjectURL(img.src); }; img.onerror=()=>res(null); img.src = URL.createObjectURL(file); }); }

function bindPlaylist(){
  const pl = curPl(); if(!pl) return;
  const nm = $('#pl-name'); nm.onchange = () => { pl.name = nm.value.trim()||'Untitled'; render(); };
  const box = $('#items'); let drag = null;
  box.onpointerdown = e => {
    const h = e.target.closest('[data-handle]'); if(!h) return;
    e.preventDefault(); drag = {i:+h.dataset.handle}; box.setPointerCapture(e.pointerId);
    box.querySelector(`.item[data-idx="${drag.i}"]`)?.classList.add('dragging');
  };
  box.onpointermove = e => {
    if(!drag) return;
    const items = [...box.querySelectorAll('.item')];
    let to = items.findIndex(it=>{ const b = it.getBoundingClientRect(); return e.clientY < b.top + b.height/2; });
    if(to<0) to = items.length-1;

  };
  const end = () => { if(!drag) return; drag=null; save(); box.innerHTML = renderItems(pl); };
  box.onpointerup = end; box.onpointercancel = end;
}

function sortPl(pl, how){
  const R = id => rec(id);
  const unitIdx = id => S.units.findIndex(u=>u.id===R(id)?.loc.u);
  const cmp = {
    loc:(a,b)=> unitIdx(a)-unitIdx(b) || (R(a).loc.c>R(b).loc.c?1:R(a).loc.c<R(b).loc.c?-1:0),
    artist:(a,b)=> R(a).artist.localeCompare(R(b).artist),
    year:(a,b)=> (+R(a).year||9999)-(+R(b).year||9999),
    bpm:(a,b)=> (+R(a).bpm||999)-(+R(b).bpm||999),
  };
  const prevOrder = [...pl.items];
  if(how==='rev') pl.items.reverse(); else pl.items.sort(cmp[how]);
  lastUndo = () => { pl.items = prevOrder; };
  render(); toast(how==='loc'?'Sorted by where they live — pull them in this order':'Sorted', true);
}

let qActive = 0;
function search(q){
  const box = $('#results'); q = q.trim().toLowerCase();

const P = {queue:[], i:-1, playing:false, mode:'loading', yt:null, ready:false, st:{}, timers:[], log:[], progT:null, dry:null, open:false, tab:'queue', src:''};
const CHAIN = ['Load the saved YouTube link','3-second window: must start playing or buffering','Try the cached alternate links','Force a fresh search (Crates backend)','Mark not working · offer “Search on YouTube” · skip'];
function stOf(r){ return P.st[r.id] ||= {cand:0, state: r.yt.length?'pending':'non_working', step:0, fails:{}}; }
function clearTimers(){ P.timers.forEach(clearTimeout); P.timers=[]; }
function plog(m){ P.log.unshift(new Date().toLocaleTimeString([], {minute:'2-digit',second:'2-digit'})+'  '+m); P.log=P.log.slice(0,30); }

function loadYT(){
  return new Promise((res,rej)=>{
    if(window.YT?.Player) return res();
    const t = setTimeout(()=>rej('timeout'), 6000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(t); res(); };
    const s = document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
    s.onerror = () => { clearTimeout(t); rej('blocked'); };
    document.head.appendChild(s);
  });
}
loadYT().then(()=>{
  P.yt = new YT.Player('yt', {height:'180', width:'320', host:'https://www.youtube-nocookie.com',
    playerVars:{autoplay:0,controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,playsinline:1,origin:location.origin},
    events:{ onReady:()=>{ P.ready=true; P.mode='yt'; renderPlayer(); },
             onStateChange:e=>onYTState(e.data), onError:e=>failCandidate('YouTube error '+e.data) }});
  setTimeout(()=>{ if(!P.ready){ P.mode='link'; renderPlayer(); } }, 6000);
}).catch(why=>{ P.mode='link'; plog('Inline playback unavailable ('+why+'), using YouTube links'); renderPlayer(); });

function setQueue(list, start=0, src=''){ if(!list.length) return; P.queue = list.map(r=>r.id); P.src = src; playAt(start); }
function cur(){ return rec(P.queue[P.i]); }
function playAt(i){
  if(!P.queue.length) return;
  P.i = (i+P.queue.length)%P.queue.length; clearTimers();
  const r = cur(); if(!r){ P.queue.splice(P.i,1); return playAt(P.i); }
  const st = stOf(r);
  if(st.state==='non_working' && r.yt.length){ st.state='pending'; st.cand=0; st.fails={}; }
  P.playing = true;
  if(P.mode!=='yt'){ st.step=0; renderPlayer(); return; }
  if(!r.yt.length){ st.state='non_working'; st.step=4; plog(`${r.title}: no saved link, search on YouTube, skipping in 3s`); renderPlayer(); P.timers.push(setTimeout(()=>next(), 3000)); return; }
  loadCandidate();
}
function loadCandidate(){
  const r = cur(), st = stOf(r), id = r.yt[st.cand];
  st.state='trying'; plog(`${r.title}: link ${st.cand+1}/${r.yt.length} (${id})`);
  P.yt.loadVideoById(id);
  st.step = st.cand===0?1:2; renderPlayer();
  P.timers.push(setTimeout(()=>{ const s = P.yt.getPlayerState?.(); if(s===1||s===3) return; failCandidate('no signal within 3s'); }, 3000));
  P.timers.push(setTimeout(()=>{ if(P.yt.getPlayerState?.()===3) failCandidate('stalled while buffering'); }, 12000));
}
function onYTState(s){
  const r = cur(); if(!r) return; const st = stOf(r);
  if(s===1){ P.playing = true;
    const d = P.yt.getDuration?.()||0;
    if(d>0 && d<30){ failCandidate('only '+Math.round(d)+'s long, likely a teaser'); return; }
    if(st.state!=='working'){ st.state='working'; plog(`${r.title}: playing`); clearTimers(); }
    tick(); }
  if(s===2){ P.playing=false; }
  if(s===0){ next(); return; }
  renderPlayer();
}
function failCandidate(reason){
  const r = cur(); if(!r) return; const st = stOf(r); clearTimers();
  st.fails[st.cand] = reason; plog(`${r.title}: link ${st.cand+1} failed, ${reason}`);
  st.cand++;
  if(st.cand < r.yt.length){ loadCandidate(); return; }
  st.step = 4; st.state='non_working';
  plog(`${r.title}: all links failed, marked not working, skipping`);
  renderPlayer(); P.timers.push(setTimeout(()=>next(), 1500));
}
function next(){ playAt(P.i+1); }
function prev(){ playAt(P.i-1); }
function toggle(){
  if(!cur()) return;
  if(P.mode!=='yt'){ P.playing = !P.playing; renderPlayer(); return; }
  if(P.playing){ P.yt.pauseVideo(); P.playing=false; } else { P.yt.playVideo(); P.playing=true; }
  renderPlayer();
}
function tick(){ clearInterval(P.progT); P.progT = setInterval(()=>{ if(!P.yt?.getDuration) return; const d=P.yt.getDuration(), t=P.yt.getCurrentTime(); document.querySelectorAll('.pbar').forEach(b=>b.style.width = d?(t/d*100)+'%':'0'); const tl=$('#ptime'); if(tl) tl.textContent = fmt(t)+' / '+fmt(d); }, 500); }
const fmt = s => isFinite(s)&&s>0 ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';

function statusText(r){
  const st = stOf(r);
  if(P.mode==='loading') return 'Connecting to YouTube…';
  if(P.mode==='link') return r.yt.length ? 'Opens on YouTube here' : 'No saved link · search YouTube';
  if(st.state==='trying') return `Trying link ${st.cand+1} of ${r.yt.length}…`;
  if(st.state==='working') return P.playing?'Playing':'Paused';
  if(st.state==='non_working') return 'Not working · skipped';
  return 'Ready';
}
const I = {play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>', pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>', next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l10-7zM16 5h3v14h-3z"/></svg>', prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14L9 12zM5 5h3v14H5z"/></svg>', ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'};

function mainBtn(r, xl){

function renderPlayer(){
  const el = $('#player'), r = cur();

function renderNP(){

function dryRun(){

  'er-delkv':d=>{ editing.custom.splice(+d.i,1); renderKV(); },
  'add-to-pl':d=>{ closeNP(); openAddToPlaylist(d.r); },
  'atp':d=>{ const p = S.playlists.find(x=>x.id===d.p); if(!p.items.includes(d.r)) p.items.push(d.r); closeSheet(); render(); toast(`Added to ${p.name}`); },
  'atp-new':d=>{ const p = {id:uid('p'),name:'New playlist',color:PL_COLORS[S.playlists.length%PL_COLORS.length],items:[d.r]}; S.playlists.push(p); closeSheet(); V.view='playlists'; V.pl=p.id; render(); $('#pl-name')?.select(); },
  'open-pl':d=>{ V.pl=d.p; render(); document.querySelector('.pledit')?.scrollIntoView({behavior:'smooth',block:'start'}); },
  'new-pl':()=>{ const p = {id:uid('p'),name:'New playlist',color:PL_COLORS[S.playlists.length%PL_COLORS.length],items:[]}; S.playlists.push(p); V.pl=p.id; render(); $('#pl-name')?.select(); },
  'pl-color':d=>{ curPl().color=d.c; render(); },
  'pl-play':()=>{ const p=curPl(); setQueue(p.items.map(rec).filter(Boolean),0,p.name); openNP(); },
  'pl-shuffle':()=>{ const p=curPl(); const l=p.items.map(rec).filter(Boolean).sort(()=>Math.random()-.5); setQueue(l,0,p.name+' · shuffled'); openNP(); },
  'pl-add':()=>openPickRecords(),
  'pl-sort':d=>sortPl(curPl(), d.s),
  'pl-up':d=>{ const p=curPl(), i=+d.i; [p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]]; render(); },
  'pl-down':d=>{ const p=curPl(), i=+d.i; [p.items[i+1],p.items[i]]=[p.items[i],p.items[i+1]]; render(); },
  'pl-rm':d=>{ const p=curPl(), i=+d.i; const [x]=p.items.splice(i,1); lastUndo=()=>p.items.splice(i,0,x); render(); toast('Removed from '+p.name, true); },
  'pl-dup':()=>{ const p=curPl(); const c={...p,id:uid('p'),name:p.name+' copy',items:[...p.items]}; S.playlists.push(c); V.pl=c.id; render(); toast('Duplicated'); },
  'pl-del':()=>{ $('#pl-confirm').innerHTML = `<div class="notice">Delete “${esc(curPl().name)}”? The records stay in your collection. <div class="row" style="margin-top:8px"><button class="btn danger" data-act="pl-del-yes">Delete playlist</button><button class="btn" data-act="pl-del-no">Keep it</button></div></div>`; },
  'pl-del-no':()=>{ $('#pl-confirm').innerHTML=''; },
  'pl-del-yes':()=>{ const p=curPl(); const idx=S.playlists.indexOf(p); S.playlists.splice(idx,1); lastUndo=()=>S.playlists.splice(idx,0,p); V.pl=S.playlists[0]?.id||null; render(); toast('Playlist deleted', true); },
  'pl-pack':()=>{ const p=curPl(); const bags=S.units.filter(u=>u.kind==='bag');
    openSheet(`<div class="sheet-head"><div><div class="kicker">${p.items.length} records</div><h2>Pack ${esc(p.name)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
      <p class="muted" style="margin-top:0">Every record in this playlist moves into the bag you pick. Their home slots stay the same, so unpacking puts them back.</p>
      <div class="targets">${bags.map(b=>`<div class="target"><div class="name">${esc(b.name)} <span class="idtag">${b.id}</span></div><button class="tbag" style="background:${esc(b.finish?.hex)}" data-act="pack-to" data-u="${b.id}">${esc(b.name)}</button></div>`).join('')}</div>`); },
  'pack-to':d=>{ const p=curPl(); const moves=[]; p.items.map(rec).filter(Boolean).forEach(r=>{ if(r.loc.u!==d.u){ moves.push([r,{...r.loc}]); r.loc={u:d.u,c:'0-0'}; } }); lastUndo=()=>moves.forEach(([r,l])=>r.loc=l); closeSheet(); render(); toast(`${moves.length} packed into ${unit(d.u).name}`, true); },
  'play-rec':d=>{ const list = inCell(V.unit, V.cell); const i = list.findIndex(r=>r.id===d.r); const u=unit(V.unit); setQueue(list, Math.max(0,i), u.kind==='shelf'&&V.cell!=='all'?u.id+'·'+cellLabel(u,V.cell):u.name); },
  'play-unit':()=>{ const u=unit(V.unit); setQueue(inCell(V.unit,V.cell),0,u.kind==='shelf'&&V.cell!=='all'?u.id+'·'+cellLabel(u,V.cell):u.name); },
  'play-all':()=>setQueue(S.records,0,'Whole collection'),
  'p-toggle':()=>toggle(), 'p-next':()=>next(), 'p-prev':()=>prev(),
  'p-at':d=>playAt(+d.i),
  'open-player':()=>openNP(), 'close-np':()=>closeNP(),
  'np-tab':d=>{ P.tab=d.t; renderNP(); },
  'dry-run':()=>dryRun(),
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act],[data-spin]'); if(!el) return;
  if(el.tagName==='A'){ if(el.dataset.spin){ P.playing = true; setTimeout(renderPlayer, 50); } return; }
  const fn = A[el.dataset.act]; if(!fn) return;
  fn(el.dataset, e, el);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(P.open){ closeNP(); return; } if(sheetKind){ closeSheet(); return; } }
  if(V.view==='unit' && !sheetKind && !P.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowRight') dig(1); if(e.key==='ArrowLeft') dig(-1);
  }
});

/* ---------- Claude photo recognition (optional) ---------- */
(async()=>{
  try{ AI = await window.claude?.use?.('sample'); if(AI){ const lim = await AI.limits().catch(()=>null); AI_IMAGES = !!lim?.images; } }catch(e){ AI = null; }
})();

/* ---------- boot ---------- */
render();
P.queue = S.records.map(r=>r.id); P.i = 0; P.src='Whole collection'; renderPlayer();
</script>
